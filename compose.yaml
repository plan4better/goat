# =============================================================================
# GOAT Docker Compose
# =============================================================================
# Profiles:
#   - (none): Infrastructure only (db, garage, redis, windmill-server,
#             windmill-worker-default)
#   - auth: + Keycloak with the compose bundle's realm, and Mailpit for its mail
#   - dev: + devcontainer, tools worker with local goatlib mount, print worker
#   - workers: + tools, workflows and print workers from the released images
#
# Usage:
#   docker compose up                    # Infrastructure only
#   docker compose --profile auth up     # + Keycloak (set AUTH=True to use it)
#   docker compose --profile dev up      # + dev environment
#
# S3 is Garage, as in the compose bundle and the e2e workflow. garage-init
# creates the layout, the access key from .env and the buckets on every start.
#
# To run GOAT itself (a deployment rather than local development), use the
# bundle in deploy/compose/.
# =============================================================================

x-env-base: &env-base
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_SERVER: ${POSTGRES_SERVER}
  S3_PROVIDER: ${S3_PROVIDER}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_REGION: ${S3_REGION}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL}


x-env-windmill: &env-windmill
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_SERVER}:5432/windmill?sslmode=disable
  DISABLE_NSJAIL: "true"

