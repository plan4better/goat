networks:
  goat:
    name: goat

volumes:
  goat-data:
  garage-meta:
  garage-data:

services:
  # ===========================================================================
  # Infrastructure (always on)
  # ===========================================================================

  db:
    image: ghcr.io/plan4better/docker-images/postgres:20251111-8198082
    container_name: goat-db
    restart: always
    networks:
      - goat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rds -d goat -h 127.0.0.1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    environment:
      DB_INSTANCE_NAME: goat-prod-db-master
      PGUSER: ${POSTGRES_USER}
      DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE_goat: goat
      DB_USERNAME_goat: ${POSTGRES_USER}
      DB_PASSWORD_goat: ${POSTGRES_PASSWORD}
      DB_DATABASE_keycloak: keycloak
      DB_USERNAME_keycloak: ${POSTGRES_USER}
      DB_PASSWORD_keycloak: ${POSTGRES_PASSWORD}
      DB_DATABASE_windmill: windmill
      DB_USERNAME_windmill: ${POSTGRES_USER}
      DB_PASSWORD_windmill: ${POSTGRES_PASSWORD}
      DB_DATABASE_ducklake: ducklake
      DB_USERNAME_ducklake: ${POSTGRES_USER}
      DB_PASSWORD_ducklake: ${POSTGRES_PASSWORD}
      DISABLE_BACKUP: 1
      DB_INIT_SQL_goat: /rds/init/init-db.sql
      DB_POSTGRES_EXTRA_CONFIG: |
        max_connections = 200
        shared_buffers = 4GB
        effective_cache_size = 12GB
        maintenance_work_mem = 2GB
        checkpoint_completion_target = 0.9
        wal_buffers = 32MB
        default_statistics_target = 100
        random_page_cost = 1.1
        effective_io_concurrency = 200
        work_mem = 26214kB
        min_wal_size = 2GB
        max_wal_size = 8GB
        max_worker_processes = 8
        max_parallel_workers_per_gather = 4
        max_parallel_workers = 4
        max_parallel_maintenance_workers = 2
        shared_preload_libraries = 'citus,pg_cron'
    ports:
      - 5432:5432
    volumes:
      - goat-data:/storage/data
      - ./scripts/db/init-db.sql:/rds/init/init-db.sql:ro

  # S3 for uploads, exports and thumbnails. The S3 API is on 3900, the admin
  # API on 3903. Uses the compose bundle's config: single node, path-style.
  garage:
    image: dxflrs/garage:v2.4.1
    container_name: goat-garage
    restart: always
    networks:
      - goat
    ports:
      - "3900:3900"
      - "3903:3903"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env (openssl rand -hex 32)}
    volumes:
      - ./deploy/compose/init/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Layout, the access key from .env, the buckets and their CORS rule.
  # Idempotent, so it runs on every start.
  garage-init:
    image: ghcr.io/plan4better/goat/windmill-worker-tools:latest
    restart: "no"
    networks:
      - goat
    # The script from this checkout: the :latest image may predate it.
    entrypoint: ["python", "/init/garage_init.py"]
    volumes:
      - ./packages/python/goatlib/src/goatlib/storage/garage_init.py:/init/garage_init.py:ro
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_S3_URL: http://garage:3900
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      GOAT_PUBLIC_URL: ${CLIENT_URL:-http://localhost:3000}
      GARAGE_CORS_ORIGINS: ${GARAGE_CORS_ORIGINS:-}
      UPLOADS_BUCKET: ${S3_BUCKET_NAME:-goat}
      ASSETS_BUCKET: ${AWS_S3_ASSETS_BUCKET:-goat-assets}
    depends_on:
      garage:
        condition: service_healthy

  # ===========================================================================
  # Sign-in (profile: auth)
  # ===========================================================================

  # Keycloak as a self-hosted install runs it: the GOAT image, importing the
  # compose bundle's realm on first start. Its database is created by `db`.
  keycloak:
    profiles: [auth]
    image: ghcr.io/plan4better/goat/keycloak:latest
    container_name: goat-keycloak
    restart: unless-stopped
    networks:
      - goat
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KEYCLOAK_DATABASE_VENDOR: postgresql
      KEYCLOAK_DATABASE_HOST: ${KEYCLOAK_DATABASE_HOST:-db}
      KEYCLOAK_DATABASE_PORT: 5432
      KEYCLOAK_DATABASE_NAME: keycloak
      KEYCLOAK_DATABASE_USER: ${POSTGRES_USER}
      KEYCLOAK_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_EXTRA_ARGS: --import-realm
      KEYCLOAK_PRODUCTION: "false"
      KEYCLOAK_ENABLE_HEALTH_ENDPOINTS: "true"
      KC_HOSTNAME_STRICT: "false"
      # As on our clusters: the sign-up fields come from the realm's declarative
      # user profile (packages/js/keycloak-theme/realm/user-profile.json).
      KC_FEATURES: declarative-user-profile
      GOAT_PUBLIC_URL: ${CLIENT_URL:-http://localhost:3000}
      GOAT_REALM: ${REALM_NAME:-goat}
      GOAT_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-goat}
      GOAT_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      GOAT_ADMIN_EMAIL: ${GOAT_ADMIN_EMAIL:-admin@goat.test}
      GOAT_ADMIN_PASSWORD: ${GOAT_ADMIN_PASSWORD:-goat-admin}
      GOAT_SSL_REQUIRED: none
      GOAT_SMTP_HOST: mailpit
      GOAT_SMTP_PORT: 1025
      GOAT_SMTP_FROM: goat@goat.test
      GOAT_SMTP_FROM_NAME: GOAT
      GOAT_SMTP_AUTH: "false"
      GOAT_SMTP_USER: ""
      GOAT_SMTP_PASSWORD: ""
      GOAT_SMTP_STARTTLS: "false"
      GOAT_SMTP_SSL: "false"
    volumes:
      - ./deploy/compose/init/keycloak/realm-goat.json:/opt/bitnami/keycloak/data/import/realm-goat.json:ro
    depends_on:
      db:
        condition: service_healthy

  # Catches the mail core and Keycloak send (invitations, password setup).
  # Web UI on 8025.
  mailpit:
    profiles: [auth]
    image: axllent/mailpit:v1.27
    container_name: goat-mailpit
    restart: unless-stopped
    networks:
      - goat
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7.4.1-alpine
    networks:
      - goat
    ports:
      - 6379:6379
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru

  # ===========================================================================
  # Windmill - Workflow Engine (always on)
  # ===========================================================================

  windmill-server:
    image: ghcr.io/plan4better/goat/windmill-server:latest
    build:
      context: .
      dockerfile: apps/processes/workers/Dockerfile
      target: server
    networks:
      - goat
    environment:
      <<: *env-windmill
      MODE: server
      BASE_URL: http://localhost:8110
    ports:
      - 8110:8000
    depends_on:
      db:
        condition: service_healthy

  windmill-worker-default:
    image: ghcr.io/plan4better/goat/windmill-worker-default:latest
    build:
      context: .
      dockerfile: apps/processes/workers/Dockerfile
      target: worker-default
    restart: unless-stopped
    networks:
      - goat
    environment:
      <<: *env-windmill
      MODE: worker
      WORKER_GROUP: default
      JOB_DEFAULT_TIMEOUT: 300
    depends_on:
      - windmill-server

  # ===========================================================================
  # Windmill Workers - Analytics & Print (profile: workers/dev)
  # ===========================================================================

  # Tools worker (analytics: buffer, heatmap, isochrone, etc.)
  windmill-worker-tools:
    profiles: [workers]
    <<: *worker-tools-base
    volumes:
      - goat-data:/app/data

  windmill-worker-tools-dev:
    profiles: [dev]
    <<: *worker-tools-base
    volumes:
      - ./packages/python/goatlib/src/goatlib:/venv/lib/python3.11/site-packages/goatlib:ro
      - goat-data:/app/data

  # Workflows worker (workflow orchestration - long-running jobs)
  windmill-worker-workflows:
    profiles: [workers]
    <<: *worker-workflows-base
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2"
          memory: 4G
    volumes:
      - goat-data:/app/data

  windmill-worker-workflows-dev:
    profiles: [dev]
    <<: *worker-workflows-base
    deploy:
      replicas: 5
      resources:
        limits:
          cpus: "2"
          memory: 4G
    volumes:
      - ./packages/python/goatlib/src/goatlib:/venv/lib/python3.11/site-packages/goatlib:ro
      - goat-data:/app/data

  # Print worker (PDF reports, thumbnails)
  windmill-worker-print:
    profiles: [workers]
    <<: *worker-print-base
    networks:
      - goat
    environment:
      <<: [*env-windmill, *env-print]
      PRINT_BASE_URL: ${PRINT_BASE_URL:-http://web:3000}
    volumes:
      - goat-data:/app/data:ro

  windmill-worker-print-dev:
    profiles: [dev]
    <<: *worker-print-base
    # Share network with goat-dev so localhost reaches dev services
    network_mode: "service:goat-dev"
    environment:
      <<: *env-print
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/windmill?sslmode=disable
      DISABLE_NSJAIL: "true"
      PRINT_BASE_URL: http://localhost:3000
    volumes:
      - ./packages/python/goatlib/src/goatlib:/venv/lib/python3.11/site-packages/goatlib:ro
      - goat-data:/app/data:ro

  # ===========================================================================
  # Development Environment (profile: dev)
  # ===========================================================================

  goat-dev:
    profiles: [dev]
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    container_name: goat-dev
    networks:
      - goat
    volumes:
      - .:/app
      - goat-data:/app/data
    depends_on:
      - db
      - garage
      - garage-init
      - redis
      - windmill-server
      - windmill-worker-default
      - windmill-worker-tools-dev
      - windmill-worker-workflows-dev
    command: sleep infinity
