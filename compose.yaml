  ATLAS_BATCH_SIZE: ${ATLAS_BATCH_SIZE:-2}
  POSTGRES_SERVER: ${POSTGRES_SERVER}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: goat
  DUCKLAKE_DATA_DIR: /app/data/ducklake
  DUCKLAKE_CATALOG_SCHEMA: ducklake
  S3_PROVIDER: ${S3_PROVIDER:-garage}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-${S3_ENDPOINT_URL}}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  S3_REGION: ${S3_REGION:-garage}
  KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL:-https://auth.dev.plan4better.de}
  REALM_NAME: ${REALM_NAME:-p4b}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-goat}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

