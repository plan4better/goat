suite: default install shape
templates:
  - catalog/deployment.yaml
  - geoapi/deployment.yaml
  - processes/deployment.yaml
  - data/pvc.yaml
  - catalog/configmap.yaml          # read by the pod checksum
  - geoapi/configmap.yaml          # read by the pod checksum
  - processes/configmap.yaml          # read by the pod checksum
  - assistant/deployment.yaml
  - assistant/configmap.yaml          # read by the pod checksum
tests:
  - it: a bare install deploys the catalog
    template: catalog/deployment.yaml
    set:
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - hasDocuments:
          count: 1
  - it: a bare install deploys geoapi
    template: geoapi/deployment.yaml
    set:
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - hasDocuments:
          count: 1
  - it: a bare install deploys processes
    template: processes/deployment.yaml
    set:
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - hasDocuments:
          count: 1
  - it: a bare install deploys the shared data PVC
    template: data/pvc.yaml
    set:
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - hasDocuments:
          count: 1
  - it: a bare install deploys the assistant
    template: assistant/deployment.yaml
    set:
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - hasDocuments:
          count: 1
  - it: geoapi, processes and their DuckLake init run as root, to write the shared data volume
    templates:
      - geoapi/deployment.yaml
      - processes/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: ducklake-init
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext
