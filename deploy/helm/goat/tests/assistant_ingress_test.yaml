suite: assistant Ingress and Service
templates:
  - assistant/ingress.yaml
  - assistant/service.yaml
tests:
  - it: routes the host to the service, with the operator's annotations (SSE without buffering)
    template: assistant/ingress.yaml
    set:
      assistant.ingress.enabled: true
      assistant.ingress.className: nginx
      assistant.ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-buffering: "off"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      assistant.ingress.hosts:
        - host: assistant.goat.example.com
          paths: [{ path: /, pathType: Prefix }]
    asserts:
      - equal:
          path: spec.rules[0].host
          value: assistant.goat.example.com
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-goat-assistant
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-buffering"]
          value: "off"
  - it: no Ingress by default
    template: assistant/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: the Service targets port 8500
    template: assistant/service.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http
