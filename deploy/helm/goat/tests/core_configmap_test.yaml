suite: core ConfigMap
templates:
  - core/configmap.yaml
tests:
  - it: renders when core.enabled and emits config keys
    set:
      core.enabled: true
      core.config.ENVIRONMENT: "test"
      core.config.JOB_TIMEOUT_DEFAULT: "999"
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-goat-core
      - equal:
          path: data.ENVIRONMENT
          value: "test"
      - equal:
          path: data.JOB_TIMEOUT_DEFAULT
          value: "999"
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: core

  - it: not rendered when core disabled
    set:
      core.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: points core at the in-chart processes service
    template: core/configmap.yaml
    set:
      core.enabled: true
      processes.enabled: true
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - equal:
          path: data.GOAT_PROCESSES_URL
          value: http://RELEASE-NAME-goat-processes
      - notExists:
          path: data.GOAT_GEOAPI_HOST
  - it: omits the processes URL when processes is disabled
    template: core/configmap.yaml
    set:
      core.enabled: true
      processes.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - notExists:
          path: data.GOAT_PROCESSES_URL
  - it: an explicit override wins over the auto-wire
    template: core/configmap.yaml
    set:
      core.enabled: true
      processes.enabled: true
      core.config.GOAT_PROCESSES_URL: http://my-processes:8300
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - equal:
          path: data.GOAT_PROCESSES_URL
          value: http://my-processes:8300
  - it: points core at the in-chart geoapi service
    template: core/configmap.yaml
    set:
      core.enabled: true
      geoapi.enabled: true
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - equal:
          path: data.GOAT_GEOAPI_URL
          value: http://RELEASE-NAME-goat-geoapi
  - it: adds geoapi's service port when it is not 80
    template: core/configmap.yaml
    set:
      core.enabled: true
      geoapi.enabled: true
      geoapi.service.port: 8100
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - equal:
          path: data.GOAT_GEOAPI_URL
          value: http://RELEASE-NAME-goat-geoapi:8100
  - it: omits the geoapi URL when geoapi is disabled
    template: core/configmap.yaml
    set:
      core.enabled: true
      geoapi.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - notExists:
          path: data.GOAT_GEOAPI_URL
  - it: an explicit geoapi URL wins over the auto-wire
    template: core/configmap.yaml
    set:
      core.enabled: true
      geoapi.enabled: true
      core.config.GOAT_GEOAPI_URL: http://my-geoapi:8100
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - equal:
          path: data.GOAT_GEOAPI_URL
          value: http://my-geoapi:8100
  - it: lets anyone create an organization by default
    template: core/configmap.yaml
    asserts:
      - equal:
          path: data.ALLOW_ORGANIZATION_CREATION
          value: "true"
  - it: leaves creating organizations to superusers with global.auth.allowOrganizationCreation false
    template: core/configmap.yaml
    set:
      global.auth.allowOrganizationCreation: false
    asserts:
      - equal:
          path: data.ALLOW_ORGANIZATION_CREATION
          value: "false"
  - it: ALLOW_ORGANIZATION_CREATION set in core.config wins
    template: core/configmap.yaml
    set:
      global.auth.allowOrganizationCreation: true
      core.config.ALLOW_ORGANIZATION_CREATION: "false"
    asserts:
      - equal:
          path: data.ALLOW_ORGANIZATION_CREATION
          value: "false"
  - it: ALLOW_ORGANIZATION_CREATION set in core.extraEnv is not rendered twice
    template: core/configmap.yaml
    set:
      core.extraEnv:
        - name: ALLOW_ORGANIZATION_CREATION
          value: "false"
    asserts:
      - notExists:
          path: data.ALLOW_ORGANIZATION_CREATION
