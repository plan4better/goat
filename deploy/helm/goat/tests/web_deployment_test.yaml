suite: web Deployment
templates:
  - web/deployment.yaml
  - web/configmap.yaml
tests:
  - it: renders Deployment with default image
    set:
      web.enabled: true
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    template: web/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-goat-web
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/plan4better/goat/web:.+"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 3000
  - it: not rendered when web.enabled false
    set:
      web.enabled: false
    template: web/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: auth.enabled + existingSecret + publicUrl sets NextAuth env from secret
    set:
      web.enabled: true
      web.auth.enabled: true
      web.auth.existingSecret: "goat-keycloak-creds"
      web.auth.publicUrl: "https://goat.example.test"
    template: web/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTAUTH_URL
            value: "https://goat.example.test"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXTAUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: goat-keycloak-creds
                key: nextauth-secret
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEXT_PUBLIC_KEYCLOAK_ISSUER
            value: "$(KEYCLOAK_SERVER_URL_RAW)/realms/$(REALM_NAME_RAW)"
