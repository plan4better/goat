suite: processes Deployment
templates:
  - processes/deployment.yaml
  - processes/configmap.yaml
tests:
  - it: renders Deployment with default image
    set:
      processes.enabled: true
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    template: processes/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-goat-processes
      - equal:
          path: spec.replicas
          value: 1
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/plan4better/goat/processes:.+"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000
  - it: gets the catalog bucket, which holds the open-data mirror
    set:
      catalog.s3.bucket: goat-catalog
      catalog.s3.existingSecret: catalog-s3
    template: processes/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CATALOG_S3_BUCKET
            value: goat-catalog
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CATALOG_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: catalog-s3
                key: secret_key
  - it: not rendered when processes.enabled false
    set:
      processes.enabled: false
    template: processes/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: mounts the shared data volume read-write and keeps extraVolumes
    template: processes/deployment.yaml
    set:
      processes.enabled: true
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
      processes.extraVolumes:
        - name: ca-bundle
          configMap:
            name: my-ca
      processes.extraVolumeMounts:
        - name: ca-bundle
          mountPath: /etc/ssl/custom
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: goat-data
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /app/data
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: ca-bundle
      - equal:
          path: spec.template.spec.volumes[0].name
          value: goat-data
      - equal:
          path: spec.template.spec.volumes[1].name
          value: ca-bundle
  - it: mounts nothing when the data volume is disabled
    template: processes/deployment.yaml
    set:
      processes.enabled: true
      data.enabled: false
      postgresql.external.host: "pg.example.com"
      postgresql.external.existingSecret: "pg-secret"
    asserts:
      - notExists:
          path: spec.template.spec.volumes
      - notExists:
          path: spec.template.spec.containers[0].volumeMounts
