{{- if .Values.geoapi.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "goat.serviceFullname" (dict "context" . "component" "geoapi") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "goat.serviceLabels" (dict "context" . "component" "geoapi") | nindent 4 }}
data:
  {{- $pgKeys := splitList " " (include "goat.postgresql.configKeys" .) }}
  {{- range $k, $v := .Values.geoapi.config }}
  {{- /* Omit GOAT_PROCESSES_URL, the Postgres connection, the DuckLake keys
         and the catalog layer directories here (emitted below so they aren't
         rendered twice when an operator sets them explicitly) */}}
  {{- if has $k (concat $pgKeys (list "GOAT_PROCESSES_URL" "DUCKLAKE_DATA_DIR" "DUCKLAKE_CATALOG_SCHEMA" "CATALOG_LAYERS_DIR" "CATALOG_TILES_DIR")) -}}
  {{- /* skip */ -}}
  {{- else }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- include "goat.postgresql.configEnv" (dict "root" $ "config" .Values.geoapi.config) | nindent 2 }}
  {{- /* The DuckLake location this service attaches READ-ONLY. Its
         ducklake-init init container reads this same ConfigMap, so it creates
         the catalog exactly where the service looks. Defaults to
         ducklakeBootstrap.*, which match GOAT's own defaults. */}}
  {{- /* Unset, the service falls back to POSTGRES_SERVER, so an extraEnv
         override of that moves DuckLake too. A geoapi.config value renders
         above. */}}
  {{- if not .Values.geoapi.config.DUCKLAKE_POSTGRES_SERVER }}
  {{- with include "goat.postgresql.ducklakeHostOverride" $ }}
  DUCKLAKE_POSTGRES_SERVER: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- if not .Values.geoapi.config.DUCKLAKE_POSTGRES_PORT }}
  {{- with include "goat.postgresql.ducklakePortOverride" $ }}
  DUCKLAKE_POSTGRES_PORT: {{ . | quote }}
  {{- end }}
  {{- end }}
  DUCKLAKE_DATA_DIR: {{ .Values.geoapi.config.DUCKLAKE_DATA_DIR | default .Values.ducklakeBootstrap.dataDir | quote }}
  DUCKLAKE_CATALOG_SCHEMA: {{ .Values.geoapi.config.DUCKLAKE_CATALOG_SCHEMA | default .Values.ducklakeBootstrap.catalogSchema | quote }}
  {{- /* Where the workers write materialized catalog layers and their PMTiles
         (catalog.layersDir / catalog.tilesDir, the values the workers get). */}}
  CATALOG_LAYERS_DIR: {{ .Values.geoapi.config.CATALOG_LAYERS_DIR | default .Values.catalog.layersDir | quote }}
  CATALOG_TILES_DIR: {{ .Values.geoapi.config.CATALOG_TILES_DIR | default .Values.catalog.tilesDir | quote }}
  {{- $processesUrl := .Values.geoapi.config.GOAT_PROCESSES_URL | default (include "goat.processes.url" .) }}
  {{- if $processesUrl }}
  GOAT_PROCESSES_URL: {{ $processesUrl | quote }}
  {{- end }}
{{- end }}
