name: "Build"

# Reusable build workflow. Mirrors test.yml: one child job per area, driven by
# the change-detection booleans from checks.yml.

on:
  workflow_call:
    inputs:
      web:
        type: boolean
        default: false
      storybook:
        type: boolean
        default: false
      keycloak-theme:
        type: boolean
        default: false
      docs:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    name: web
    if: ${{ inputs.web }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🏗️ GOAT build
        uses: ./.github/actions/pnpm-cache-build
        with:
          cwd: ${{ github.workspace }}

  storybook:
    name: storybook
    if: ${{ inputs.storybook }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🏗️ Storybook build
        run: pnpm --filter @p4b/storybook build

  # Fast compile check for the theme jar. The deployable artifact is the
  # docker image built by release.yml (release-docker-keycloak).
  keycloak-theme:
    name: keycloak-theme
    if: ${{ inputs.keycloak-theme }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🏗️ Keycloak theme build
        shell: bash
        run: |
          cd ${{ github.workspace }}/packages/js/keycloak-theme
          pnpm run build-keycloak-theme

  # A page that points at a missing image or video fails the webpack build, and
  # release.yml only builds the docs image on main. Building here catches it on
  # the PR instead.
  docs:
    name: docs
    if: ${{ inputs.docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🏗️ Docs build (en + de)
        run: pnpm --filter @p4b/docs build
