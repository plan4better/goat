name: "Test"

# Reusable test workflow. Driven by the change-detection booleans from
# checks.yml so only affected areas run. Every suite is required; one that is
# not green on a clean tree can be marked `continue-on-error: true` until it
# is.

on:
  workflow_call:
    inputs:
      web:
        type: boolean
        default: false
      core:
        type: boolean
        default: false
      goatlib:
        type: boolean
        default: false
      geoapi:
        type: boolean
        default: false
      processes:
        type: boolean
        default: false
      catalog:
        type: boolean
        default: false
      assistant:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    name: web (vitest)
    if: ${{ inputs.web }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. vitest suite is green.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install
      # vitest runs in jsdom and its config excludes playwright/ and
      # **/*.e2e.*, but lib/print/__tests__/pdf-renderer.test.ts is a plain
      # *.test.ts inside the tree and launches a real Chromium in beforeAll,
      # so the browser has to be here. The e2e suite is not run in CI at all —
      # running it needs a service stack, and that is a separate decision.
      # Keyed on the Playwright release, which decides the browser build, not
      # on the whole lockfile, which changes far more often.
      - name: 🎭 Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: 💾 Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: 📥 Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      # vmForks builds the jsdom environment once per worker instead of once per
      # test file, while each file still gets its own modules and mocks, so the
      # suite runs about three times faster than on the default pool. It holds
      # more memory, which a CI runner has room for and a laptop may not, so the
      # pool is chosen here rather than in vitest.config.ts.
      - name: 🧪 Vitest
        run: pnpm --filter web exec vitest run --pool=vmForks --maxWorkers=4

  core:
    name: core (pytest)
    if: ${{ inputs.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. The suite passes against PostGIS alone: it self-
    # bootstraps schemas (DROP/CREATE + metadata.create_all in the session
    # fixture), the asset tests are pure-unit, and external services (S3, DNS,
    # Caddy) are mocked/faked — no S3 or network needed.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rds
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: rds
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goat
      POSTGRES_PORT: "5432"
      AUTH: "False"
      ENVIRONMENT: dev
      # No S3 service here, and none is wanted. Presigning a URL is local
      # signing, so credentials — any credentials — are all the thumbnail
      # tests need to assert that a stored key comes back as a signed URL
      # rather than the default artwork. The endpoint points at a closed port
      # so the few calls that do reach for S3 (a bundle import reading its
      # upload) fail at once with connection refused instead of travelling to
      # real AWS.
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_ENDPOINT_URL: http://127.0.0.1:1
      S3_FORCE_PATH_STYLE: "true"
      # Without this botocore retries each refused connection with backoff,
      # which cost 8 of the 9 seconds tests/api/test_folder_guard.py took.
      AWS_MAX_ATTEMPTS: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      # gdal is sdist-only and needs libgdal to build; only goatlib's WFS/
      # converter paths import it (lazily), so this suite runs without it.
      # routing is the C++ package: compiling it was most of every job's
      # install time, and only goatlib's bundle code imports it (lazily), so
      # every suite but goatlib skips it too.
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      # --no-sync: a bare `uv run` re-syncs and would pull gdal back in.
      - name: 🧪 pytest
        # -n 4: one worker per runner CPU; conftest gives each worker its own
        # database schema.
        run: uv run --no-sync pytest tests/ -n 4
        working-directory: apps/core

  alembic:
    name: alembic (fresh upgrade)
    if: ${{ inputs.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED. The core suite builds its schema with metadata.create_all, so
    # nothing else here runs a migration. This walks the chain on an empty
    # database the way a fresh deploy does, then `alembic check` asserts the
    # result matches the models — the drift the create_all path cannot see.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rds
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: rds
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goat
      POSTGRES_PORT: "5432"
      AUTH: "False"
      ENVIRONMENT: dev
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      # `init` creates its own schemas and both extensions, so an empty
      # database is all this needs.
      - name: 🗄️ alembic upgrade head
        run: uv run --no-sync alembic upgrade head
        working-directory: apps/core
      - name: 🗄️ alembic check (no model drift)
        run: uv run --no-sync alembic check
        working-directory: apps/core
      # The authz functions (initial_data's first step) and the assistant's
      # grant list against them: customer.can runs with the caller's
      # privileges, so a role with apps/assistant/sql/grants.sql must be able
      # to run it. Needs a migrated database with those functions, which only
      # this job has; the assistant job's schema holds just the assistant
      # tables. The job's user is a superuser (the image's POSTGRES_USER), and
      # this Postgres is throwaway, so the test may create its NOLOGIN role.
      - name: 🗄️ SQL functions
        run: >-
          uv run --no-sync python -c "import asyncio;
          from core.core.config import settings;
          from core.db.session import session_manager;
          from core.db.sql.init_functions import init_functions;
          session_manager.init(settings.ASYNC_SQLALCHEMY_DATABASE_URI);
          asyncio.run(init_functions())"
        working-directory: apps/core
      - name: 🔐 assistant grants cover customer.can
        env:
          ASSISTANT_TEST_ROLES: "1"
          ASSISTANT_GRANTS_CHECK_DSN: postgresql://rds:postgres@localhost:5432/goat
        run: uv run --no-sync pytest tests/test_db_grants.py -v -p no:cacheprovider
        working-directory: apps/assistant

  goatlib:
    name: goatlib (pytest)
    if: ${{ inputs.goatlib }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQUIRED. Data-dependent tests skip when their fixtures are absent;
    # travel-time matrices auto-download from assets.plan4better.de.
    # Postgres is only for the DuckLake catalog tests (see their step).
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rds
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      # Its own cache entry: every uv job has the same default key and the
      # first to finish saves it, which was never this one, the only job that
      # compiles a wheel (gdal) the cache is there to keep.
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
          cache-suffix: goatlib
      # Only suite that needs real gdal (WFS/converter tests). The compiled
      # wheel lands in the uv cache, so the source build runs once per
      # lockfile change, not per run. `tippecanoe` is needed because
      # `PMTilesGenerator.__init__` refuses to construct without the binary
      # on PATH, so the tests/io and tests/unit/io PMTiles suites cannot even
      # reach their assertions without it.
      - name: 🌍 Install libgdal-dev and tippecanoe
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgdal-dev tippecanoe
      # routing is the C++ package, and building it is most of this job's
      # install. uv rebuilds a path dependency after every checkout because its
      # files look new, so the wheel is cached here instead. The key covers what
      # the build reads (the package's files but not its Python tests,
      # CMakeLists.txt with the libduckdb version it pins among them, and the
      # Python version), the nigiri SDK it downloads and the runner image: any
      # change there builds a fresh wheel. The lockfile is left out because the
      # wheel builds in an isolated environment that never reads it. The SDK
      # comes from nigiri's `latest-cpp` release, whose assets are replaced in
      # place, so it is keyed on their digests. The routing job copies these
      # three steps to share the cached wheel: change both jobs together.
      - name: 🖥️ Runner image and nigiri SDK
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          nigiri=$(gh api repos/plan4better/nigiri/releases/tags/latest-cpp \
            --jq '[.assets[] | .name + "=" + .digest] | sort | join(",")' | sha256sum | cut -c1-16)
          echo "nigiri=$nigiri" >> "$GITHUB_OUTPUT"
      - name: 📦 Restore routing wheel
        id: routing-wheel
        uses: actions/cache@v6
        with:
          path: .routing-wheel
          key: routing-wheel-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ steps.image.outputs.nigiri }}-${{ hashFiles('packages/cpp/routing/**', '!packages/cpp/routing/tests/**', '.python-version') }}
      - name: 🏗️ Build routing wheel
        if: steps.routing-wheel.outputs.cache-hit != 'true'
        run: uv build --wheel packages/cpp/routing --out-dir .routing-wheel
      - name: 🐍 Install dependencies
        run: |
          uv sync --frozen --all-packages --all-extras --no-install-package routing
          uv pip install --no-deps .routing-wheel/*.whl
      - name: 🧪 pytest (unit, utils, io)
        # The rest of tests/integration needs a populated DuckLake catalog and
        # data fixtures this job does not have. tests/benchmarks holds
        # manually-run scripts, not tests. -n 4: one worker per runner CPU.
        # The billing task tests (credit reset, compute and traffic rollups) sit
        # directly under tests/.
        run: >-
          uv run --no-sync pytest tests/unit tests/utils tests/io
          tests/test_compute_rollup.py tests/test_credit_reset.py
          tests/test_traffic_rollup.py -n 4
        working-directory: packages/python/goatlib
      - name: 🧪 pytest (DuckLake catalog on Postgres)
        # These need only Postgres: each test makes a throwaway catalog schema
        # and drops it afterwards. They fail rather than skip when Postgres is
        # unreachable in CI.
        run: >-
          uv run --no-sync pytest -m integration
          tests/integration/test_pinned_reads_pg.py
          tests/integration/test_ducklake_pg_sessions.py
        working-directory: packages/python/goatlib
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_USER: rds
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goat

  workflow-chains:
    name: workflow chains (pytest)
    # It also runs the assistant's regression workflows that do not route
    # (apps/assistant/evals/workflow_runs.json), so an assistant change runs it.
    if: ${{ inputs.goatlib || inputs.assistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. Workflows run end to end (tests/integration/tools/chains and
    # test_geometry_only_chain.py in goatlib): the real workflow runner, each
    # step through the script Windmill runs for it, the real tools on
    # Postgres and DuckLake. Windmill is stood in, so it is not needed; no
    # chain step routes or goes through GDAL, so the routing package and GDAL
    # are not installed. One pytest worker: the tests share one test schema.
    services:
      # The PostGIS image creates the extension in POSTGRES_DB. The chain
      # tests refuse the app's own database names, so they get one of their own.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rds
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goat_chains_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rds
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goat_chains_test
    steps:
      # The job runs beside the other test jobs and is part of the required
      # check, so its time counts toward the PR's; the last step warns when
      # it goes over its budget.
      - name: ⏱️ Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest (workflow chains)
        # DuckLake's files and the tools' tiles go under the runner's temp
        # directory: the services' /app/data does not exist on this runner.
        # --durations lists the slowest chains, for when the job gets slow.
        env:
          DUCKLAKE_DATA_DIR: ${{ runner.temp }}/ducklake
          TILES_DATA_DIR: ${{ runner.temp }}/tiles
        run: |
          mkdir -p "$DUCKLAKE_DATA_DIR" "$TILES_DATA_DIR"
          uv run --no-sync pytest tests/integration/tools/chains tests/integration/tools/test_geometry_only_chain.py -v --durations=10
        working-directory: packages/python/goatlib
      - name: ⏱️ Duration
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED ))
          echo "### workflow chains: $((elapsed / 60)) min $((elapsed % 60)) s (budget 5 min)" >> "$GITHUB_STEP_SUMMARY"
          [ "$elapsed" -le 300 ] || echo "::warning::workflow chains took ${elapsed}s, over its 5 minute budget"

  routing:
    name: routing (pytest)
    if: ${{ inputs.goatlib }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. The C++ router's own tests (packages/cpp/routing/tests) on
    # Munich's street network, its H3 res-3 cell 8077, installed by goatlib's
    # sync_base_data and cached by its published version. A job of its own
    # rather than steps in the goatlib job, the longest of the test jobs: it
    # runs beside that job, so it adds to a PR's time only when it outlasts
    # it. It needs neither GDAL nor Postgres, only goatlib (for the install)
    # and the routing wheel, from the goatlib job's cache entry.
    steps:
      - name: ⏱️ Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      # The goatlib job's three steps, key for key, so both jobs share one
      # cached wheel. When it is missing, both build it and the first to
      # finish saves it.
      - name: 🖥️ Runner image and nigiri SDK
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          nigiri=$(gh api repos/plan4better/nigiri/releases/tags/latest-cpp \
            --jq '[.assets[] | .name + "=" + .digest] | sort | join(",")' | sha256sum | cut -c1-16)
          echo "nigiri=$nigiri" >> "$GITHUB_OUTPUT"
      - name: 📦 Restore routing wheel
        id: routing-wheel
        uses: actions/cache@v6
        with:
          path: .routing-wheel
          key: routing-wheel-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ steps.image.outputs.nigiri }}-${{ hashFiles('packages/cpp/routing/**', '!packages/cpp/routing/tests/**', '.python-version') }}
      - name: 🏗️ Build routing wheel
        if: steps.routing-wheel.outputs.cache-hit != 'true'
        run: uv build --wheel packages/cpp/routing --out-dir .routing-wheel
      - name: 🐍 Install dependencies
        run: |
          uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
          uv pip install --no-deps .routing-wheel/*.whl
      # Installed and cached as in the workflow chains workflow
      # (workflow-chains.yml): the key names the cell and the published
      # version, and the cache is saved right after the install.
      - name: 🗺️ Street network version
        id: base-data
        run: |
          sudo mkdir -p /app/data
          sudo chown "$(id -u):$(id -g)" /app/data
          channels=$(curl -sf --retry 3 https://goat-base-data.plan4better.de/channels.json)
          street_network=$(jq -er '.channels.stable.street_network' <<< "$channels")
          echo "street-network=$street_network" >> "$GITHUB_OUTPUT"
      - name: 💾 Restore the street network
        id: street-network-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            /app/data/.base/street_network
            /app/data/street_network
          key: base-data-street-network-h3-8077-${{ steps.base-data.outputs.street-network }}
      # On a cache hit sync finds the link and the cell it installed and
      # downloads nothing.
      - name: 🗺️ Install Munich's street network
        run: >-
          uv run --no-sync python -c
          "from goatlib.tasks.sync_base_data import SyncBaseDataParams, sync;
          print(sync(SyncBaseDataParams(datasets=['street_network'], h3_3=[8077], data_dir='/app/data')))"
      - name: 💾 Save the street network
        if: steps.street-network-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /app/data/.base/street_network
            /app/data/street_network
          key: base-data-street-network-h3-8077-${{ steps.base-data.outputs.street-network }}
      # From the repository root, with its pytest settings, as the tests run
      # locally. They read the street network where the tools read it, and
      # in CI they fail instead of skipping when it or the wheel is missing.
      - name: 🧪 pytest (router)
        env:
          STREET_NETWORK_EDGES_BASE_PATH: /app/data/street_network/edges
          STREET_NETWORK_NODES_BASE_PATH: /app/data/street_network/nodes
        run: uv run --no-sync pytest packages/cpp/routing/tests -v --durations=10
      - name: ⏱️ Duration
        if: always()
        run: |
          elapsed=$(( $(date +%s) - JOB_STARTED ))
          echo "### routing: $((elapsed / 60)) min $((elapsed % 60)) s (budget 3 min)" >> "$GITHUB_STEP_SUMMARY"
          [ "$elapsed" -le 180 ] || echo "::warning::routing took ${elapsed}s, over its 3 minute budget"

  goatobs:
    name: goatobs (pytest)
    # Shares goatlib's input: the paths-filter feeds packages/python/goatobs
    # into the core/geoapi/catalog filters that input is derived from.
    if: ${{ inputs.goatlib }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED. Pure unit suite — no services.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest
        run: uv run --no-sync pytest tests/
        working-directory: packages/python/goatobs

  geoapi:
    name: geoapi (pytest)
    if: ${{ inputs.geoapi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED. Suite is fully mocked (DuckLake/Postgres) — no services needed.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest
        run: uv run --no-sync pytest tests/
        working-directory: apps/geoapi

  processes:
    name: processes (pytest)
    if: ${{ inputs.processes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED. Suite is fully mocked (Windmill/DB) — no services needed.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest
        run: uv run --no-sync pytest tests/
        working-directory: apps/processes

  catalog:
    name: catalog (pytest)
    if: ${{ inputs.catalog }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. Suite runs against generated parquet fixtures — no services
    # needed; DuckDB extensions (spatial/fts) are fetched on first run and
    # cached by setup-uv's cache thereafter.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest
        # -n 4: one worker per runner CPU.
        run: uv run --no-sync pytest tests/ -n 4
        working-directory: apps/catalog

  assistant:
    name: assistant (pytest)
    if: ${{ inputs.assistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. Every test needs Postgres (the conftest builds the assistant
    # tables from core's models in a schema per worker); the bus tests marked
    # `integration` need Redis. mypy runs here rather than in lint.yml because
    # strict mode needs the package's dependencies, which only this job installs.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rds
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: rds
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goat
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      AUTH: "False"
      # Postgres here is throwaway and its user a superuser, so the tests that
      # create a cluster-wide role (the privilege check against roles with no,
      # partial and full grants) run; they are skipped anywhere else.
      ASSISTANT_TEST_ROLES: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      # From apps/assistant: from the repository root mypy resolves `assistant.*`
      # imports to Any (explicit_package_bases without a mypy_path). evals/ and
      # e2e/ are checked wherever they exist.
      - name: 🔬 mypy (strict)
        run: |
          dirs=src
          for d in evals e2e; do
            if [ -d "$d" ]; then dirs="$dirs $d"; fi
          done
          uv run --no-sync mypy $dirs
        working-directory: apps/assistant
      - name: 🧪 pytest
        # -n 4: one worker per runner CPU; conftest gives each worker its own
        # schema. The eval runner is outside testpaths and never runs here.
        run: uv run --no-sync pytest tests/ -n 4
        working-directory: apps/assistant
