name: "Test"

# Reusable test workflow. Driven by the change-detection booleans from
# checks.yml so only affected areas run. Every suite is required; one that is
# not green on a clean tree can be marked `continue-on-error: true` until it
# is.

on:
  workflow_call:
    inputs:
      web:
        type: boolean
        default: false
      core:
        type: boolean
        default: false
      goatlib:
        type: boolean
        default: false
      geoapi:
        type: boolean
        default: false
      processes:
        type: boolean
        default: false
      catalog:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    name: web (vitest)
    if: ${{ inputs.web }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. vitest suite is green.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 📥 Monorepo install
        uses: plan4better/.github/.github/actions/pnpm-install@main
        with:
          enable-corepack: true
          cwd: ${{ github.workspace }}
          node_version: 22
      # vitest runs in jsdom and its config excludes playwright/ and
      # **/*.e2e.*, but lib/print/__tests__/pdf-renderer.test.ts is a plain
      # *.test.ts inside the tree and launches a real Chromium in beforeAll,
      # so the browser has to be here. The e2e suite is not run in CI at all —
      # running it needs a service stack, and that is a separate decision.
      # Keyed on the Playwright release, which decides the browser build, not
      # on the whole lockfile, which changes far more often.
      - name: 🎭 Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: 💾 Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: 📥 Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      # vmForks builds the jsdom environment once per worker instead of once per
      # test file, while each file still gets its own modules and mocks, so the
      # suite runs about three times faster than on the default pool. It holds
      # more memory, which a CI runner has room for and a laptop may not, so the
      # pool is chosen here rather than in vitest.config.ts.
      - name: 🧪 Vitest
        run: pnpm --filter web exec vitest run --pool=vmForks --maxWorkers=4

  core:
    name: core (pytest)
    if: ${{ inputs.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. The suite passes against PostGIS alone: it self-
    # bootstraps schemas (DROP/CREATE + metadata.create_all in the session
    # fixture), the asset tests are pure-unit, and external services (S3, DNS,
    # Caddy) are mocked/faked — no MinIO or network needed.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rds
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: rds
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goat
      POSTGRES_PORT: "5432"
      AUTH: "False"
      ENVIRONMENT: dev
      # No S3 service here, and none is wanted. Presigning a URL is local
      # signing, so credentials — any credentials — are all the thumbnail
      # tests need to assert that a stored key comes back as a signed URL
      # rather than the default artwork. The endpoint points at a closed port
      # so the few calls that do reach for S3 (a bundle import reading its
      # upload) fail at once with connection refused instead of travelling to
      # real AWS.
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_ENDPOINT_URL: http://127.0.0.1:1
      S3_FORCE_PATH_STYLE: "true"
      # Without this botocore retries each refused connection with backoff,
      # which cost 8 of the 9 seconds tests/api/test_folder_guard.py took.
      AWS_MAX_ATTEMPTS: "1"
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      # gdal is sdist-only and needs libgdal to build; only goatlib's WFS/
      # converter paths import it (lazily), so this suite runs without it.
      # routing is the C++ package: compiling it was most of every job's
      # install time, and only goatlib's bundle code imports it (lazily), so
      # every suite but goatlib skips it too.
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      # --no-sync: a bare `uv run` re-syncs and would pull gdal back in.
      - name: 🧪 pytest
        # -n 4: one worker per runner CPU; conftest gives each worker its own
        # database schema.
        run: uv run --no-sync pytest tests/ -n 4
        working-directory: apps/core

  alembic:
    name: alembic (fresh upgrade)
    if: ${{ inputs.core }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED. The core suite builds its schema with metadata.create_all, so
    # nothing else here runs a migration. This walks the chain on an empty
    # database the way a fresh deploy does, then `alembic check` asserts the
    # result matches the models — the drift the create_all path cannot see.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rds
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_USER: rds
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goat
      POSTGRES_PORT: "5432"
      AUTH: "False"
      ENVIRONMENT: dev
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      # `init` creates its own schemas and both extensions, so an empty
      # database is all this needs.
      - name: 🗄️ alembic upgrade head
        run: uv run --no-sync alembic upgrade head
        working-directory: apps/core
      - name: 🗄️ alembic check (no model drift)
        run: uv run --no-sync alembic check
        working-directory: apps/core

  goatlib:
    name: goatlib (pytest)
    if: ${{ inputs.goatlib }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # REQUIRED. Data-dependent tests skip when their fixtures are absent;
    # travel-time matrices auto-download from assets.plan4better.de.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      # Its own cache entry: every uv job has the same default key and the
      # first to finish saves it, which was never this one, the only job that
      # compiles a wheel (gdal) the cache is there to keep.
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
          cache-suffix: goatlib
      # Only suite that needs real gdal (WFS/converter tests). The compiled
      # wheel lands in the uv cache, so the source build runs once per
      # lockfile change, not per run. `tippecanoe` is needed because
      # `PMTilesGenerator.__init__` refuses to construct without the binary
      # on PATH, so the tests/io and tests/unit/io PMTiles suites cannot even
      # reach their assertions without it.
      - name: 🌍 Install libgdal-dev and tippecanoe
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgdal-dev tippecanoe
      # routing is the C++ package, and building it is most of this job's
      # install. uv rebuilds a path dependency after every checkout because its
      # files look new, so the wheel is cached here instead. The key covers what
      # the build reads (the package's files but not its Python tests,
      # CMakeLists.txt with the libduckdb version it pins among them, and the
      # Python version), the nigiri SDK it downloads and the runner image: any
      # change there builds a fresh wheel. The lockfile is left out because the
      # wheel builds in an isolated environment that never reads it. The SDK
      # comes from nigiri's `latest-cpp` release, whose assets are replaced in
      # place, so it is keyed on their digests.
      - name: 🖥️ Runner image and nigiri SDK
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
          nigiri=$(gh api repos/plan4better/nigiri/releases/tags/latest-cpp \
            --jq '[.assets[] | .name + "=" + .digest] | sort | join(",")' | sha256sum | cut -c1-16)
          echo "nigiri=$nigiri" >> "$GITHUB_OUTPUT"
      - name: 📦 Restore routing wheel
        id: routing-wheel
        uses: actions/cache@v6
        with:
          path: .routing-wheel
          key: routing-wheel-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ steps.image.outputs.nigiri }}-${{ hashFiles('packages/cpp/routing/**', '!packages/cpp/routing/tests/**', '.python-version') }}
      - name: 🏗️ Build routing wheel
        if: steps.routing-wheel.outputs.cache-hit != 'true'
        run: uv build --wheel packages/cpp/routing --out-dir .routing-wheel
      - name: 🐍 Install dependencies
        run: |
          uv sync --frozen --all-packages --all-extras --no-install-package routing
          uv pip install --no-deps .routing-wheel/*.whl
      - name: 🧪 pytest (unit, utils, io)
        # tests/integration is excluded on purpose: it needs a DuckLake catalog
        # and Postgres fixtures this job has no services for. tests/benchmarks
        # holds manually-run scripts, not tests. -n 4: one worker per runner CPU.
        run: uv run --no-sync pytest tests/unit tests/utils tests/io -n 4
        working-directory: packages/python/goatlib

  goatobs:
    name: goatobs (pytest)
    # Shares goatlib's input: the paths-filter feeds packages/python/goatobs
    # into the core/geoapi/catalog filters that input is derived from.
    if: ${{ inputs.goatlib }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED. Pure unit suite — no services.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest
        run: uv run --no-sync pytest tests/
        working-directory: packages/python/goatobs

  geoapi:
    name: geoapi (pytest)
    if: ${{ inputs.geoapi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED. Suite is fully mocked (DuckLake/Postgres) — no services needed.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest
        run: uv run --no-sync pytest tests/
        working-directory: apps/geoapi

  processes:
    name: processes (pytest)
    if: ${{ inputs.processes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # REQUIRED. Suite is fully mocked (Windmill/DB) — no services needed.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest
        run: uv run --no-sync pytest tests/
        working-directory: apps/processes

  catalog:
    name: catalog (pytest)
    if: ${{ inputs.catalog }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # REQUIRED. Suite runs against generated parquet fixtures — no services
    # needed; DuckDB extensions (spatial/fts) are fetched on first run and
    # cached by setup-uv's cache thereafter.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      - name: 🐍 Install dependencies
        run: uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing
      - name: 🧪 pytest
        # -n 4: one worker per runner CPU.
        run: uv run --no-sync pytest tests/ -n 4
        working-directory: apps/catalog
