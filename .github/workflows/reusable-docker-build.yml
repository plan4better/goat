---
name: Docker Build and Push
on:
  workflow_call:
    inputs:
      context:
        description: Docker context (path) to start build from
        required: false
        type: string
      file:
        description: Dockerfile path relative to context
        required: false
        type: string
      flavor-rules:
        description: Metadata flavor rules
        required: false
        type: string
        default: |
          latest=false
      image-name:
        description: Docker image name to build
        required: true
        type: string
      platforms:
        description: Platforms to build for
        required: false
        type: string
        default: linux/amd64
      tag-rules:
        description: Tag rules for docker/metadata-action
        required: false
        type: string
        default: |
          type=raw,value={{sha}},enable=${{ github.ref_type == 'branch' }}
          type=ref,event=tag,priority=200
          type=ref,event=pr,priority=100
      target:
        description: Docker build target stage name
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Each platform builds natively on its own runner: arm64 runners are free
    # for public repositories, and QEMU emulation made arm64 builds 2-3x slower.
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        # Expressions have no split(), so drop the platforms `inputs.platforms`
        # leaves out. Not `include`: it runs after `exclude` and would add an
        # excluded platform back.
        exclude:
          - platform: ${{ !contains(inputs.platforms, 'linux/amd64') && 'linux/amd64' || 'none' }}
          - platform: ${{ !contains(inputs.platforms, 'linux/arm64') && 'linux/arm64' || 'none' }}
    steps:
      - name: 📥 Prepare safe identifiers
        run: |
          # sanitize platform for artifact/cache scopes
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

          # sanitize image name for artifact uniqueness
          image="${{ inputs.image-name }}"
          safe_image=${image//\//-}
          echo "SAFE_IMAGE=$safe_image" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: 🐳 Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: 📦 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          flavor: ${{ inputs.flavor-rules }}
          tags: ${{ inputs.tag-rules }}

      - name: 🐳 Build and Push per-platform (digest only)
        id: build
        uses: docker/build-push-action@v7
        with:
          provenance: false
          platforms: ${{ matrix.platform }}
          # Default to the checked-out workspace. With no context,
          # build-push-action falls back to the Git context and BuildKit
          # re-clones the whole repository inside the builder, discarding
          # the checkout above.
          context: ${{ inputs.context || '.' }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          push: true
          outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # One cache per platform, or the platforms overwrite each other's.
          cache-from: type=registry,ref=${{ inputs.image-name }}:buildcache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ inputs.image-name }}:buildcache-${{ env.PLATFORM_PAIR }},mode=max

      - name: 📤 Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: 📤 Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.SAFE_IMAGE }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: 📥 Prepare safe image identifier
        run: |
          image="${{ inputs.image-name }}"
          safe_image=${image//\//-}
          echo "SAFE_IMAGE=$safe_image" >> $GITHUB_ENV

      - name: 📥 Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          # ✅ only grab digests for THIS image
          pattern: digests-${{ env.SAFE_IMAGE }}-*
          merge-multiple: true

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📦 Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` means the newest stable release. A tag earns it only when it is
      # the highest vX.Y.Z in the repository, so a patch release on a maintenance
      # branch never overtakes a newer major and pre-release tags never qualify.
      # Tags come from ls-remote, not a checkout: a full-history clone of this
      # repo is large, and with every merge job cloning at once it took far
      # longer than the merge itself.
      - name: 🏷️ Decide whether this tag becomes latest
        id: latest
        run: |
          latest=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            highest=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'v*' \
              | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            [[ "$GITHUB_REF_NAME" == "$highest" ]] && latest=true
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME highest=${highest:-none} latest=$latest"

      - name: 🐳 Docker metadata extraction
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image-name }}
          flavor: ${{ inputs.flavor-rules }}
          tags: |
            ${{ inputs.tag-rules }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest == 'true' }}

      - name: 🐳 Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          echo "Merging digests for ${{ inputs.image-name }}..."
          ls -l .
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.image-name }}@sha256:%s ' *)

      - name: 🐳 Inspect Built Image
        run: docker buildx imagetools inspect ${{ inputs.image-name }}:${{ steps.meta.outputs.version }}
