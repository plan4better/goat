name: "Next.js bundle analysis comment"

# Posts the bundle-size comment produced by nextjs-bundle-analysis.yml. Runs in
# the base repo's context so it can comment on fork PRs, where the analysis run
# itself only gets a read-only token.
on:
  workflow_run:
    workflows: ["PR"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: 📥 Download bundle comment artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        # PR runs without web changes have no analysis, so no artifact.
        run: >-
          gh run download "$RUN_ID" --name bundle-comment --dir bundle-comment
          || echo "No bundle comment artifact in run $RUN_ID."

      # The artifact is built from PR code, so treat its contents as untrusted:
      # sanitize the PR number and only comment if that PR's head matches the
      # commit the triggering run actually analyzed.
      - name: 🔍 Validate PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! -f bundle-comment/__bundle_analysis_comment.txt || ! -f bundle-comment/__pr_number ]]; then
            echo "No bundle comment artifact; nothing to post."
            exit 0
          fi
          number=$(tr -cd '0-9' < bundle-comment/__pr_number)
          head_sha=$(gh api "repos/${{ github.repository }}/pulls/$number" --jq .head.sha 2>/dev/null || echo missing)
          if [[ -n "$number" && "$head_sha" == "${{ github.event.workflow_run.head_sha }}" ]]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "PR number in artifact does not match the triggering run; skipping."
          fi

      # One comment per PR, found by the marker the analysis puts in it and
      # updated on every run.
      - name: 💬 Post or update the bundle comment
        if: steps.pr.outputs.number
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          MARKER: "<!-- __NEXTJS_BUNDLE_@p4b/web -->"
        run: |
          body=$(cat bundle-comment/__bundle_analysis_comment.txt)
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments?per_page=100" \
            --jq '[.[] | select(.body | contains(env.MARKER)) | .id] | first // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" >/dev/null
            echo "Updated comment $id on #$PR"
          else
            gh pr comment "$PR" --body "$body"
          fi
