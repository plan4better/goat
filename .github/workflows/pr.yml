name: "PR"

# Not on pushes to main: release.yml lints, tests and builds every push there,
# and running this too duplicated all of it.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow token gets read access only; jobs that need more ask for it.
permissions:
  contents: read

concurrency:
  # Key on PR number, not head_ref: fork branches often share names (several
  # contributors PR from their fork's `main`), and equal groups would cancel
  # each other's CI.
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  file-changes:
    name: file-changes
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  lint:
    name: lint
    needs: file-changes
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    with:
      web: ${{ needs.file-changes.outputs.web == 'true' }}
      python: >-
        ${{ needs.file-changes.outputs.core == 'true'
        || needs.file-changes.outputs.geoapi == 'true'
        || needs.file-changes.outputs.processes == 'true'
        || needs.file-changes.outputs.catalog == 'true'
        || needs.file-changes.outputs.assistant == 'true' }}

  test:
    name: test
    needs: file-changes
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      web: ${{ needs.file-changes.outputs.web == 'true' }}
      core: ${{ needs.file-changes.outputs.core == 'true' }}
      # goatlib is a shared lib; run its suite on any python-package change,
      # and on routing changes, which it tests.
      goatlib: >-
        ${{ needs.file-changes.outputs.core == 'true'
        || needs.file-changes.outputs.geoapi == 'true'
        || needs.file-changes.outputs.processes == 'true'
        || needs.file-changes.outputs.catalog == 'true'
        || needs.file-changes.outputs.workers == 'true' }}
      geoapi: ${{ needs.file-changes.outputs.geoapi == 'true' }}
      processes: ${{ needs.file-changes.outputs.processes == 'true' }}
      catalog: ${{ needs.file-changes.outputs.catalog == 'true' }}
      assistant: ${{ needs.file-changes.outputs.assistant == 'true' }}

  build:
    name: build
    needs: file-changes
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      web: ${{ needs.file-changes.outputs.web == 'true' }}
      storybook: ${{ needs.file-changes.outputs.storybook == 'true' }}
      keycloak-theme: ${{ needs.file-changes.outputs.keycloak-theme == 'true' }}
      docs: ${{ needs.file-changes.outputs.docs == 'true' }}

  file-size:
    name: file-size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR's merge commit and its parents, trees only: the check fetches
      # just the blobs of the files the PR adds or modifies.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: scripts
      - name: 📏 Keep large files out of the repository
        run: scripts/check-file-sizes.sh HEAD^1 HEAD

  doc-references:
    name: doc-references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The docs being checked plus the service code their setting names are
      # looked up in; the web app and everything else stays out of the checkout.
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.md
            /.gitignore
            /scripts/
            /apps/*/AGENTS.md
            /apps/*/README.md
            /apps/core/
            /apps/geoapi/
            /apps/processes/
            /apps/catalog/
            /packages/python/goatlib/
      - name: 📚 READMEs and AGENTS.md name only files and settings that exist
        run: python3 scripts/check-doc-references.py

  compose-bundle:
    name: compose-bundle
    needs: file-changes
    if: ${{ needs.file-changes.outputs.compose-bundle == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/compose
      - name: 🧪 setup.sh derives every deployment variant
        run: bash deploy/compose/tests/setup-check.sh
      - name: 🧪 compose.yaml and Caddyfile render for every variant
        run: bash deploy/compose/tests/config-check.sh

  helm-chart:
    name: helm-chart
    needs: file-changes
    if: ${{ needs.file-changes.outputs.helm == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            deploy/helm
            .github/actions/helm-tools
      - uses: ./.github/actions/helm-tools
      - name: 🧪 Lint, unit tests, render and schema-check every fixture
        run: ./deploy/helm/check.sh

  required:
    # file-changes too: when it fails, every job after it is skipped, not
    # failed, and would count as passed.
    needs: [file-changes, lint, test, build, file-size, doc-references, compose-bundle, helm-chart]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fail only on real failures/cancellations. `skipped` is expected and OK:
      # change-detection legitimately skips jobs for unaffected areas (e.g.
      # the web build on a core-only PR). Advisory steps use continue-on-error
      # so their job still succeeds.
      - name: fail if required jobs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
