name: "Lint"
on:
  workflow_call:
    inputs:
      web:
        type: boolean
        description: "Whether to run web linting"
        required: false
        default: true

      python:
        type: boolean
        description: "Whether to run python linting"
        required: false
        default: true

permissions:
  contents: read

jobs:
  web:
    # REQUIRED. lint-web.sh runs `tsc --noEmit` (typecheck) + eslint.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.web }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 📥 Monorepo install
        uses: ./.github/actions/pnpm-install

      - name: 🔬 Run linting
        run: bash ${{ github.workspace }}/scripts/lint-web.sh

      # ESLint findings as annotations on the PR's lines. They are workflow
      # commands printed to the log, which need no token, so fork PRs get
      # them too, and they run after a failed lint as well. GitHub shows ten
      # errors and ten warnings per step, so errors come first.
      - name: 🔬 Annotate lint results
        if: always() && hashFiles('lint-results/goat.json') != ''
        run: |
          jq -r --arg root "$GITHUB_WORKSPACE/" '
            def prop: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
            def msg: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            [ .[] | (.filePath | ltrimstr($root)) as $file | .messages[] | . + {file: $file} ]
            | sort_by(-.severity) | .[]
            | "::\(if .severity == 2 then "error" else "warning" end) file=\(.file | prop),line=\(.line // 1),col=\(.column // 1),title=\(.ruleId // "eslint" | prop)::\(.message | msg)"
          ' lint-results/goat.json

      - name: 🔬 Upload ESLint report
        if: ${{ always() }}
        # The report is a debugging convenience -- the annotate step above
        # already surfaces the findings. A failed upload (artifact storage
        # quota, a 403 from the artifact service) must not fail the job: this
        # workflow gates the release, so that would skip every image build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: ${{ github.workspace }}/lint-results

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ inputs.python }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true

      # ruff reads the source only, so the dev group it is pinned in is all
      # this job installs.
      - name: 🐍 Install ruff
        run: uv sync --frozen --only-dev
        working-directory: ${{ github.workspace }}

      # REQUIRED: ruff lint on the packages that are clean. Keeps them clean and
      # blocks regressions. Not goatlib, which still carries ruff debt. mypy
      # --strict and `ruff format --check` are not run here either: no package
      # passes them yet, so they would only report the same debt on every run
      # (scripts/lint-python.sh runs them locally).
      # --no-sync: a bare `uv run` would sync the whole workspace first.
      - name: 🔬 ruff check (clean packages, required)
        run: >-
          uv run --no-sync ruff check
          apps/core apps/geoapi apps/processes apps/catalog
          packages/python/goatobs
        working-directory: ${{ github.workspace }}
