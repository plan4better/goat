name: "E2E"

# The Playwright suite (apps/web/playwright) against a stack started from
# source: infra from the root compose.yaml, core, geoapi, processes and
# catalog with uvicorn, and a production build of the web app, with auth on:
# Keycloak (the GOAT image, importing the compose bundle's realm) and Mailpit
# to catch email. Windmill runs the jobs, as in production: the released
# server and worker images, with this checkout's goatlib mounted into the
# tools and workflows workers, as the root compose.yaml's dev profile does.
# `scripts/e2e/provision.py` creates the test users per role, their
# organizations and the owner's datasets through the real API (an upload and
# its import job); the Playwright setup logs each one in once and the specs
# pick a role.
#
# Runs on every PR that changes the app, a service or the suite itself, and on
# every push to main (which also catches two PRs that only break together).
# Not a required check yet: until the suite has proven stable, a red run
# informs the PR without blocking it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "scripts/e2e/**"
      - "playwright.config.ts"
      - "apps/web/**"
      - "apps/core/**"
      - "apps/geoapi/**"
      - "apps/processes/**"
      - "apps/catalog/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Steps that download or install have their own, shorter limits, several
    # times their slowest healthy run: a hung package mirror then fails the
    # step in minutes instead of holding the job for the full hour.
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      # The Windmill images are large: pulled in the background while the
      # rest installs.
      - name: 🌬️ Pull the Windmill images
        run: |
          mkdir -p logs
          for image in windmill-server windmill-worker-default windmill-worker-tools windmill-worker-print; do
            nohup docker pull -q "ghcr.io/plan4better/goat/$image:latest" > "logs/pull-$image.log" 2>&1 &
          done

      # One set of settings for the compose infra (which reads .env) and for
      # every service, all of which read their settings from the environment:
      # .env.example's localhost development values, pointed at services on
      # this runner instead of compose service names. No status or website
      # feeds: the run does not depend on the live website, and a fresh user
      # would otherwise get the first-visit spotlight, a modal over every page.
      - name: ⚙️ Environment
        run: |
          cp .env.example .env
          # The services on the runner and the workers in their containers
          # share one data directory at the same path, as DuckLake records
          # absolute file paths.
          data_dir=/app/data
          sudo mkdir -p "$data_dir"
          sudo chown "$(id -u):$(id -g)" "$data_dir"
          # Garage keys have their own shape: GK + 24 hex, and 64 hex.
          key_id="GK$(openssl rand -hex 12)"
          key_secret="$(openssl rand -hex 32)"
          cat >> .env <<EOF
          POSTGRES_SERVER=localhost
          DUCKLAKE_POSTGRES_SERVER=localhost
          S3_ENDPOINT_URL=http://localhost:3900
          S3_PUBLIC_ENDPOINT_URL=http://localhost:3900
          ASSETS_S3_ENDPOINT_URL=http://localhost:3900
          ASSETS_URL=http://localhost:3900/goat-assets
          S3_PROVIDER=garage
          S3_REGION=garage
          AWS_REGION=garage
          S3_ACCESS_KEY_ID=$key_id
          S3_SECRET_ACCESS_KEY=$key_secret
          AWS_ACCESS_KEY_ID=$key_id
          AWS_SECRET_ACCESS_KEY=$key_secret
          S3_BUCKET_NAME=goat
          AWS_S3_ASSETS_BUCKET=goat-assets
          GARAGE_RPC_SECRET=$(openssl rand -hex 32)
          GARAGE_ADMIN_TOKEN=$(openssl rand -hex 32)
          DATA_DIR=$data_dir
          DUCKLAKE_DATA_DIR=$data_dir/ducklake
          TILES_DATA_DIR=$data_dir/tiles
          GOAT_PROCESSES_URL=http://localhost:8300
          WINDMILL_URL=http://localhost:8110
          WINDMILL_WORKSPACE=goat
          WINDMILL_TOKEN_FILE=$data_dir/windmill/.token
          WINDMILL_ADMIN_EMAIL=admin@windmill.dev
          WINDMILL_ADMIN_PASSWORD=$(openssl rand -hex 16)
          PRINT_BASE_URL=http://localhost:3000
          NEXT_PUBLIC_CATALOG_URL=http://localhost:8400/stac
          NEXT_PUBLIC_STATUS_FEED_URL=
          NEXT_PUBLIC_WEBSITE_URL=
          NEXTAUTH_SECRET=e2e-only-secret
          NEXTAUTH_URL=http://localhost:3000
          AUTH=True
          NEXT_PUBLIC_AUTH=True
          KEYCLOAK_SERVER_URL=http://localhost:8080
          REALM_NAME=goat
          KEYCLOAK_CLIENT_ID=goat
          KEYCLOAK_CLIENT_SECRET=$(openssl rand -hex 16)
          NEXT_PUBLIC_KEYCLOAK_ISSUER=http://localhost:8080/realms/goat
          NEXT_PUBLIC_KEYCLOAK_CLIENT_ID=goat
          KEYCLOAK_PROVISION_INVITED_USERS=True
          E2E_KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 16)
          E2E_PASSWORD=E2e-$(openssl rand -hex 12)!
          E2E_AUTH=1
          SMTP_HOST=localhost
          SMTP_PORT=1025
          SMTP_SECURITY=none
          SMTP_FROM=goat@e2e.test
          EOF
          mkdir -p "$data_dir"
          # Later lines win, as in a shell `. .env`; GITHUB_ENV takes the
          # last value of a name too.
          grep -E '^[A-Z_][A-Z0-9_]*=' .env | sed 's/"//g' >> "$GITHUB_ENV"

      # Setup runs side by side: everything that does not feed the web build
      # (infra, Python, Chromium's system packages) starts in the background
      # or runs while the build does, and is awaited where it is needed.
      # scripts/e2e/bg.sh and await.sh keep each task's log in logs/.
      - name: 🐘 Start the infra (Postgres, Redis, Garage, Keycloak, Mailpit)
        run: scripts/e2e/bg.sh infra scripts/e2e/infra.sh

      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.2"
          enable-cache: true
          prune-cache: true
      # As in the test jobs: gdal and the C++ routing package are imported
      # lazily, by code paths the suite does not reach.
      - name: 🐍 Start the Python dependencies
        run: scripts/e2e/bg.sh python uv sync --frozen --all-packages --all-extras --no-install-package gdal --no-install-package routing

      - name: 📥 JS dependencies
        timeout-minutes: 10
        uses: ./.github/actions/pnpm-install

      # Turbopack keeps its build work in apps/web/.next/cache (on by default
      # since Next 16.3). Pull requests start from the cache main last saved;
      # only main saves one, as a pull request's cache is visible to that
      # pull request alone.
      - name: 💾 Restore the web build cache
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: 🏗️ Start the web build
        run: scripts/e2e/bg.sh build pnpm --filter @p4b/web build

      # While the web builds: the browser's version, for its cache key.
      - name: 🎭 Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: 💾 Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Chromium and its system packages install in the background too; the
      # tests are the first to need them.
      - name: 📥 Start installing Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: scripts/e2e/bg.sh chromium pnpm --filter web exec playwright install --with-deps chromium
      - name: 📥 Start installing Playwright's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: scripts/e2e/bg.sh chromium pnpm --filter web exec playwright install-deps chromium

      - name: ⏳ Infra and Python dependencies
        run: |
          scripts/e2e/await.sh infra 600
          scripts/e2e/await.sh python 600

      - name: 🪣 Buckets
        env:
          GARAGE_ADMIN_URL: http://localhost:3903
          GARAGE_S3_URL: http://localhost:3900
          GOAT_PUBLIC_URL: http://localhost:3000
          UPLOADS_BUCKET: goat
          ASSETS_BUCKET: goat-assets
        run: uv run --no-sync python -m goatlib.storage.garage_init

      - name: 🗄️ Database, seed data, DuckLake catalog
        run: |
          (cd apps/core && uv run --no-sync alembic upgrade head)
          (cd apps/core && uv run --no-sync python -m core.scripts.initial_data)
          uv run --no-sync python -m goatlib.storage.ducklake_init

      # Jobs run in the released worker images, on the host network so
      # that localhost reaches Postgres, Garage, Keycloak and the web app as
      # it does for the services, and as the runner's user so that the
      # services can write to what the jobs create in the data directory.
      # The server keeps its own network: on the host's it would take port
      # 8000 from core. Windmill passes a job only the variables in
      # WHITELIST_ENVS, the compose bundle's list.
      - name: 🌬️ Windmill
        timeout-minutes: 15
        run: |
          image=ghcr.io/plan4better/goat
          windmill_db="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/windmill?sslmode=disable"
          whitelist=$(sed -n '/WHITELIST_ENVS: >-/{n;s/^ *//;p}' deploy/compose/compose.yaml)
          [ -n "$whitelist" ] || { echo "::error::WHITELIST_ENVS not found in the compose bundle"; exit 1; }
          # The settings every service reads, with the last value of a name
          # winning, as in GITHUB_ENV.
          grep -E '^[A-Z_][A-Z0-9_]*=' .env | sed 's/"//g' \
            | awk -F= '{last[$1]=$0} END {for (k in last) print last[k]}' > "$RUNNER_TEMP/worker.env"
          cat >> "$RUNNER_TEMP/worker.env" <<EOF
          DATABASE_URL=$windmill_db
          MODE=worker
          DISABLE_NSJAIL=true
          BASE_INTERNAL_URL=http://localhost:8110
          POSTGRES_DATABASE_URI=postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB
          WHITELIST_ENVS=$whitelist
          EOF
          for image_name in windmill-server windmill-worker-default windmill-worker-tools windmill-worker-print; do
            docker pull -q "$image/$image_name:latest" > /dev/null
          done
          docker run -d --name windmill-server -p 8110:8000 --add-host host.docker.internal:host-gateway \
            -e DATABASE_URL="${windmill_db/localhost/host.docker.internal}" -e MODE=server \
            -e BASE_URL=http://localhost:8110 "$image/windmill-server:latest"
          docker run -d --name windmill-worker-default --network host \
            -e DATABASE_URL="$windmill_db" -e MODE=worker -e WORKER_GROUP=default \
            -e DISABLE_SERVER=true -e DISABLE_NSJAIL=true -e BASE_INTERNAL_URL=http://localhost:8110 \
            "$image/windmill-worker-default:latest"
          goatlib="$PWD/packages/python/goatlib/src/goatlib:/venv/lib/python3.11/site-packages/goatlib:ro"
          for group in tools workflows; do
            docker run -d --name "windmill-worker-$group" --network host --user "$(id -u):$(id -g)" \
              --env-file "$RUNNER_TEMP/worker.env" -e WORKER_GROUP="$group" -e WORKER_TAGS="$group" \
              -e JOB_DEFAULT_TIMEOUT=1800 -v "$goatlib" -v /app/data:/app/data \
              "$image/windmill-worker-tools:latest"
          done
          docker run -d --name windmill-worker-print --network host --user "$(id -u):$(id -g)" \
            --env-file "$RUNNER_TEMP/worker.env" -e WORKER_GROUP=print -e WORKER_TAGS=print \
            -e JOB_DEFAULT_TIMEOUT=300 -v /app/data:/app/data "$image/windmill-worker-print:latest"
          mkdir -p "$(dirname "$WINDMILL_TOKEN_FILE")"
          uv run --no-sync python -m goatlib.windmill_init > /dev/null
          # A fresh Windmill answers before its last migration, which waits
          # for the workers to register; scripts created before then fail.
          # The sync is idempotent, so it is retried until Windmill takes it.
          for attempt in $(seq 1 30); do
            if uv run --no-sync sh deploy/compose/init/windmill/windmill-sync.sh > logs/windmill-sync.log 2>&1; then
              echo "scripts synced on attempt $attempt"; break
            fi
            [ "$attempt" = 30 ] && { tail -20 logs/windmill-sync.log; echo "::error::Windmill sync never succeeded"; exit 1; }
            sleep 10
          done

      # core reads Keycloak's signing key at startup, so the realm must be
      # up before the services start.
      - name: 🔑 Wait for Keycloak
        run: |
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/realms/goat >/dev/null && { echo "realm ready after $((i * 2))s"; exit 0; }
            sleep 2
          done
          docker logs keycloak | tail -40
          echo "::error::Keycloak realm never came up"; exit 1

      - name: 🚀 Services
        run: |
          mkdir -p logs
          start() { (cd "apps/$1" && nohup uv run --no-sync uvicorn "$1.main:app" --port "$2" > "../../logs/$1.log" 2>&1 &) ; }
          start core 8000
          start geoapi 8100
          start processes 8300
          # catalog serves a parquet mirror this runner does not have; the
          # specs only open its page, so a catalog that fails to start is
          # tolerated (its log is kept for the report).
          start catalog 8400

      - name: ⏳ Web build
        run: scripts/e2e/await.sh build 900
      - name: 💾 Save the web build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: apps/web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: 🌐 Web server
        run: |
          (cd apps/web && nohup pnpm start --port 3000 > ../../logs/web.log 2>&1 &)
          for url in http://localhost:8000/api/healthz http://localhost:8100/ http://localhost:8300/ http://localhost:3000/; do
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" != "000" ] && break
              sleep 2
            done
            echo "$url -> $code"
            [ "$code" != "000" ] || { echo "::error::$url never answered"; exit 1; }
          done

      - name: 👥 Test users, organizations, datasets
        run: uv run --no-sync python scripts/e2e/provision.py --datasets

      - name: ⏳ Playwright Chromium
        run: scripts/e2e/await.sh chromium 900

      - name: 🧪 Playwright
        run: pnpm exec playwright test --config=playwright.config.ts

      # Where the suite spends its time, on every run: the slowest specs.
      - name: ⏱️ Slowest specs
        if: always()
        run: |
          [ -f test-results/reports/results.xml ] || exit 0
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import xml.etree.ElementTree as ET
          cases = [
              (float(case.get("time") or 0), case.get("classname", ""), case.get("name", ""))
              for case in ET.parse("test-results/reports/results.xml").iter("testcase")
          ]
          print("### Slowest specs\n\n| Seconds | Spec | Test |\n|---:|---|---|")
          for seconds, spec, name in sorted(cases, reverse=True)[:15]:
              print(f"| {seconds:.0f} | {spec.replace('apps/web/playwright/', '')} | {name} |")
          print(f"\nTotal across {len(cases)} tests: {sum(c[0] for c in cases) / 60:.1f} min")
          PY

      - name: 🗒️ Container logs
        if: failure()
        run: |
          for c in keycloak mailpit garage windmill-server windmill-worker-default \
            windmill-worker-tools windmill-worker-workflows windmill-worker-print; do
            docker logs "$c" > "logs/$c.log" 2>&1 || true
          done

      - name: 📤 Report and service logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            test-results/
            logs/
          retention-days: 14
