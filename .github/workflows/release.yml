name: "Release"

# Releases are the v* tag pushes. Publishing a GitHub release for that tag
# is not a trigger: it ran the whole pipeline a second time for the same
# commit and pushed the same image tags concurrently.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

# The workflow token gets read access only; jobs that need more ask for it.
permissions:
  contents: read

jobs:
  file-changes:
    name: file-changes
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit

  lint:
    name: lint
    needs: file-changes
    uses: ./.github/workflows/lint.yml
    secrets: inherit
    # Direct pushes to main get no pr.yml run, so this is their only lint.
    with:
      web: >-
        ${{ needs.file-changes.outputs.web == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}
      python: >-
        ${{ needs.file-changes.outputs.core == 'true'
        || needs.file-changes.outputs.geoapi == 'true'
        || needs.file-changes.outputs.processes == 'true'
        || needs.file-changes.outputs.catalog == 'true'
        || needs.file-changes.outputs.assistant == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}

  # Gate releases on the test suites. Change-detection picks the affected
  # suites on branch pushes; tag releases run everything (same override the
  # release jobs use).
  # A push that touches none of their paths skips every suite, and a skipped
  # `test` would skip each release job below that needs it. So those jobs
  # check `!failure() && !cancelled()` rather than the implicit success():
  # skipped suites don't block a release, failed ones still do.
  test:
    name: test
    needs: file-changes
    uses: ./.github/workflows/test.yml
    secrets: inherit
    with:
      web: >-
        ${{ needs.file-changes.outputs.web == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}
      core: >-
        ${{ needs.file-changes.outputs.core == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}
      goatlib: >-
        ${{ needs.file-changes.outputs.core == 'true'
        || needs.file-changes.outputs.geoapi == 'true'
        || needs.file-changes.outputs.processes == 'true'
        || needs.file-changes.outputs.catalog == 'true'
        || needs.file-changes.outputs.workers == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}
      geoapi: >-
        ${{ needs.file-changes.outputs.geoapi == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}
      processes: >-
        ${{ needs.file-changes.outputs.processes == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}
      catalog: >-
        ${{ needs.file-changes.outputs.catalog == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}
      assistant: >-
        ${{ needs.file-changes.outputs.assistant == 'true'
        || startsWith(github.ref, 'refs/tags/v') }}

  # Each image job gives the image a smoke test (smoke-command), run inside
  # the pushed image before it is tagged: a failure keeps a broken image
  # from being tagged and deployed. id-token and attestations: write sign
  # its provenance attestation.
  release-docker-web:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.web == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/web/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/web
      title: "GOAT Web"
      description: "GOAT's web application: the frontend for maps, dashboards, workflows and reports."
      smoke-command: |
        cd /app
        node apps/web/server.js > /tmp/web.log 2>&1 &
        for i in $(seq 1 30); do
          node -e "fetch('http://127.0.0.1:3000/').then(r => { console.log('HTTP', r.status); process.exit(0) }, () => process.exit(1))" && exit 0
          sleep 1
        done
        cat /tmp/web.log
        exit 1

  release-docker-core:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.core == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/core/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/core
      title: "GOAT Core"
      description: "GOAT's core API for users, organizations, projects and layer metadata."
      # AUTH=false: with auth on the settings require a Keycloak URL, which
      # an import check does not need.
      smoke-command: |
        cd /app
        export AUTH=false POSTGRES_SERVER=localhost POSTGRES_USER=smoke POSTGRES_PASSWORD=smoke POSTGRES_DB=smoke
        python -c "import core.main"

  release-docker-geoapi:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.geoapi == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/geoapi/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/geoapi
      title: "GOAT GeoAPI"
      description: "GOAT's OGC API Features and Tiles service for layer data."
      # AUTH=false: with auth on the settings require a Keycloak URL, which
      # an import check does not need.
      smoke-command: |
        cd /app
        export AUTH=false
        python -c "import geoapi.main"
        python -c "import duckdb; c = duckdb.connect(config={'autoinstall_known_extensions': False}); [c.execute(f'LOAD {e}') for e in ('spatial', 'httpfs', 'postgres', 'ducklake', 'h3')]"
        command -v tippecanoe-overzoom

  release-docker-catalog:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.catalog == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/catalog/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/catalog
      title: "GOAT Catalog"
      description: "GOAT's STAC API for searching and browsing the data catalog."
      # AUTH=false: with auth on the settings require a Keycloak URL, which
      # an import check does not need.
      smoke-command: |
        cd /app
        export AUTH=false
        python -c "import catalog.main"
        python -c "import duckdb, os; c = duckdb.connect(config={'extension_directory': os.environ['DUCKDB_EXTENSION_DIRECTORY'], 'autoinstall_known_extensions': False}); c.execute('LOAD spatial'); c.execute('LOAD httpfs')"

  release-docker-assistant:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.assistant == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/assistant/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/assistant
      title: "GOAT Assistant"
      description: "GOAT's AI assistant: conversations, agent runs, the model layer and the MCP endpoint."
      # AUTH=false: with auth on the settings require a Keycloak URL, which an
      # import check does not need. The last two lines check what the
      # deployments rely on: no fixture generator in the wheel, and the
      # graceful-shutdown bound the platforms' grace periods are sized for.
      smoke-command: |
        cd /app
        export AUTH=false
        python -c "import assistant.main"
        python -c "from assistant.llm.capabilities import TESTED_MODELS; print(len(TESTED_MODELS), 'tested models')"
        python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('assistant.encoding.fixtures') is not None)"
        test ! -e /app/apps/assistant/evals && test ! -e /app/apps/assistant/e2e
        test "$UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN" = 20

  release-docker-processes:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.processes == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/processes/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/processes
      title: "GOAT Processes"
      description: "GOAT's OGC API Processes service, which runs the analysis tools."
      # AUTH=false: with auth on the settings require a Keycloak URL, which
      # an import check does not need.
      smoke-command: |
        cd /app
        export AUTH=false
        python -c "import processes.main"
        python -c "import duckdb; c = duckdb.connect(config={'autoinstall_known_extensions': False}); [c.execute(f'LOAD {e}') for e in ('spatial', 'httpfs', 'postgres', 'ducklake', 'h3')]"

  release-docker-storybook:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.storybook == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/storybook/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/storybook
      title: "GOAT Storybook"
      description: "GOAT's UI component library, as a Storybook site."
      smoke-command: |
        nginx -t
        test -s /usr/share/nginx/html/storybook/index.html

  release-docker-docs:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.docs == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/docs/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/docs
      # The image has no .git; the pages' "last updated" dates come from
      # this file instead.
      fetch-history: true
      prepare-command: node apps/docs/src/vcs/lastUpdated.js
      title: "GOAT Docs"
      description: "GOAT's user documentation site."
      smoke-command: |
        nginx -t
        test -s /usr/share/nginx/html/docs/index.html

  release-docker-keycloak:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.keycloak-theme == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./packages/js/keycloak-theme/Dockerfile
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/keycloak
      title: "GOAT Keycloak"
      description: "Keycloak with GOAT's login theme."
      smoke-command: |
        for jar in p4b-keycloak-theme keycloak-metrics-spi-4.0.0 io.phasetwo.keycloak-keycloak-events-0.19; do
          test -s "/opt/bitnami/keycloak/providers/$jar.jar"
        done

  # Windmill images. The server and default worker only change with the
  # Windmill version in the worker Dockerfile; tools and print carry goatlib
  # and routing.
  release-docker-windmill-server:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.windmill == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/processes/workers/Dockerfile
      target: server
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/windmill-server
      title: "GOAT Windmill Server"
      description: "Windmill server that schedules and runs GOAT's background jobs."
      smoke-command: |
        /usr/src/app/windmill --version

  release-docker-windmill-worker-default:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.windmill == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/processes/workers/Dockerfile
      target: worker-default
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/windmill-worker-default
      title: "GOAT Windmill Worker"
      description: "Windmill worker for GOAT's scheduled and system jobs."
      smoke-command: |
        /usr/src/app/windmill --version

  release-docker-windmill-worker-tools:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.workers == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/processes/workers/Dockerfile
      target: worker-tools
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/windmill-worker-tools
      title: "GOAT Windmill Tools Worker"
      description: "Windmill worker that runs GOAT's analysis tools, such as catchment areas, heatmaps and buffers."
      smoke-command: |
        python -c "import importlib; from goatlib.tools.registry import TOOL_REGISTRY; from goatlib.tasks.registry import TASK_REGISTRY; ds = [d for d in (*TOOL_REGISTRY, *TASK_REGISTRY) if d.worker_tag == 'tools']; [importlib.import_module(d.module_path) for d in ds]; print(len(ds), 'tools modules import')"
        python -c "import duckdb; c = duckdb.connect(config={'autoinstall_known_extensions': False}); [c.execute(f'LOAD {e}') for e in ('spatial', 'httpfs', 'postgres', 'ducklake', 'h3')]"
        tippecanoe --version
        ogr2ogr --version

  release-docker-windmill-worker-print:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.workers == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      file: ./apps/processes/workers/Dockerfile
      target: worker-print
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/windmill-worker-print
      title: "GOAT Windmill Print Worker"
      description: "Windmill worker that renders GOAT's map layouts to PDF or PNG and creates project and layer thumbnails."
      smoke-command: |
        python -c "import importlib; from goatlib.tools.registry import TOOL_REGISTRY; from goatlib.tasks.registry import TASK_REGISTRY; ds = [d for d in (*TOOL_REGISTRY, *TASK_REGISTRY) if d.worker_tag == 'print']; [importlib.import_module(d.module_path) for d in ds]; print(len(ds), 'print modules import')"
        python -c "import duckdb; c = duckdb.connect(config={'autoinstall_known_extensions': False}); [c.execute(f'LOAD {e}') for e in ('spatial', 'httpfs', 'postgres', 'ducklake', 'h3')]"
        python -c "
        from playwright.sync_api import sync_playwright
        with sync_playwright() as p:
            b = p.chromium.launch()
            page = b.new_page()
            page.set_content('<h1>GOAT</h1>')
            page.pdf(path='/tmp/smoke.pdf')
            b.close()
        "
        for font in Verdana Garamond Consolas; do fc-list ":family=$font" | grep -q . || { echo "no font stands in for $font"; exit 1; }; done

  # The single-server deployment bundle (deploy/compose), pinned to this
  # release's images. Attached to the tag's GitHub release; created as a
  # draft when the release does not exist yet.
  release-compose-bundle:
    needs:
      - release-docker-web
      - release-docker-core
      - release-docker-geoapi
      - release-docker-catalog
      - release-docker-assistant
      - release-docker-processes
      - release-docker-keycloak
      - release-docker-windmill-server
      - release-docker-windmill-worker-default
      - release-docker-windmill-worker-tools
      - release-docker-windmill-worker-print
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy/compose
      - name: Check the bundle
        run: |
          bash deploy/compose/tests/setup-check.sh
          bash deploy/compose/tests/config-check.sh
      - name: Build the bundle
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/goat-compose
          rsync -a --exclude compose.build.yaml --exclude tests deploy/compose/ dist/goat-compose/
          sed -i "s/^GOAT_VERSION=.*/GOAT_VERSION=${TAG}/" dist/goat-compose/.env.example
          grep -q "^GOAT_VERSION=${TAG}$" dist/goat-compose/.env.example
          tar -C dist -czf "dist/goat-compose-${TAG}.tar.gz" goat-compose
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          gh release upload "$TAG" "dist/goat-compose-${TAG}.tar.gz" --clobber
