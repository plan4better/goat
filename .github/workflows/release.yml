      pull-requests: write
    with:
      dockerhub-enable: false
      ghcr-enable: true
      push: ${{ github.event_name != 'pull_request' }}
      file: ./apps/processes/workers/Dockerfile
      target: worker-default
      platforms: linux/amd64,linux/arm64
      image-name: ghcr.io/${{ github.repository }}/windmill-worker-default

  release-docker-windmill-worker-tools:
    needs: [file-changes, lint, test]
    if: ${{ !failure() && !cancelled() && (needs.file-changes.outputs.processes == 'true' || startsWith(github.ref, 'refs/tags/v')) }}
    uses: ./.github/workflows/reusable-docker-build.yml
    permissions:
      contents: read
      packages: write
      pull-requests: write
    with:
      dockerhub-enable: false
