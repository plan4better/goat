name: "PR Base"

# PR housekeeping: the title check and cache cleanup. Both need a write token
# on fork PRs too, hence pull_request_target, which is safe here only because
# neither job checks out or runs PR code. Keep the CI pipeline (pr.yml) on
# plain pull_request; never add pull_request_target to a workflow that builds
# PR code.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, closed]

permissions: {}

jobs:
  # The release notes list PR titles, so titles follow Conventional Commits
  # like the commits do. A PR that breaks the rule gets a comment explaining
  # it, removed again once the title is fixed.
  title:
    name: title
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # The title arrives through the environment, never pasted into the
      # script: it is text anyone opening a PR controls.
      - name: 🔎 Check the PR title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          MARKER: "<!-- pr-title-check -->"
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          existing=$(gh api "repos/$GH_REPO/issues/$PR/comments?per_page=100" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | contains(env.MARKER))) | .id] | first // empty')

          if [[ "$TITLE" =~ ^($types)(\([^\)]+\))?!?:\ [^[:space:]] ]]; then
            if [ -n "$existing" ]; then
              gh api --method DELETE "repos/$GH_REPO/issues/comments/$existing"
            fi
            echo "PR title follows Conventional Commits."
            exit 0
          fi

          body="$MARKER
          Hey there and thank you for opening this pull request! 👋🏼

          We require pull request titles to follow the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/), since the release notes are built from them, and it looks like your proposed title needs to be adjusted.

          It should read \`type(optional scope): description\`, for example \`fix(web): keep the legend visible when printing\`, with one of these types: \`${types//|/\`, \`}\`."
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi
          echo "::error::The PR title does not follow Conventional Commits: type(optional scope): description"
          exit 1

  # A closed PR's caches are never restored again but count against the
  # repository's cache quota until they expire.
  caches:
    name: clean caches
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 🧹 Delete the closed PR's caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          deleted=0
          for id in $(gh cache list --ref "$REF" --limit 100 --json id --jq '.[].id'); do
            gh cache delete "$id"
            deleted=$((deleted + 1))
          done
          echo "Deleted $deleted caches of $REF"
