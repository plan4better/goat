name: "Checks"

on:
  workflow_call:
    outputs:
      web:
        description: "Web changed"
        value: ${{ jobs.checks.outputs.web }}

      core:
        description: "Core changed"
        value: ${{ jobs.checks.outputs.core }}

      geoapi:
        description: "Geoapi changed"
        value: ${{ jobs.checks.outputs.geoapi }}

      docs:
        description: "Docs changed"
        value: ${{ jobs.checks.outputs.docs }}

      keycloak-theme:
        description: "Keycloak theme changed"
        value: ${{ jobs.checks.outputs.keycloak-theme }}

      storybook:
        description: "Storybook changed"
        value: ${{ jobs.checks.outputs.storybook }}

      processes:
        description: "Processes API changed"
        value: ${{ jobs.checks.outputs.processes }}

      workers:
        description: "Windmill worker images (tools, print) changed"
        value: ${{ jobs.checks.outputs.workers }}

      windmill:
        description: "Windmill server and default worker images changed"
        value: ${{ jobs.checks.outputs.windmill }}

      catalog:
        description: "Catalog (STAC service) changed"
        value: ${{ jobs.checks.outputs.catalog }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      contents: read
    outputs:
      web: ${{ steps.changes.outputs.web }}
      core: ${{ steps.changes.outputs.core }}
      geoapi: ${{ steps.changes.outputs.geoapi }}
      docs: ${{ steps.changes.outputs.docs }}
      keycloak-theme: ${{ steps.changes.outputs.keycloak-theme }}
      storybook: ${{ steps.changes.outputs.storybook }}
      processes: ${{ steps.changes.outputs.processes }}
      workers: ${{ steps.changes.outputs.workers }}
      windmill: ${{ steps.changes.outputs.windmill }}
      catalog: ${{ steps.changes.outputs.catalog }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🕵️ Detect changes
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            web:
                - 'apps/web/**'
                - 'packages/js/**'
                - '.prettier*'
                - 'pnpm-lock.yaml'

            core:
                - 'apps/core/**'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            geoapi:
                - 'apps/geoapi/**'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            catalog:
                - 'apps/catalog/**'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            docs:
                - 'apps/docs/**'
                - 'packages/js/**'
                - '.prettier*'
                - 'pnpm-lock.yaml'

            keycloak-theme:
                - 'packages/js/keycloak-theme/**'
                - 'packages/js/eslint-config-p4b/**'
                - 'packages/js/prettier-config/**'
                - 'packages/js/tsconfig/**'
                - 'packages/js/types/**'
                - 'packages/js/ui/**'
                - '.prettier*'
                - 'pnpm-lock.yaml'

            storybook:
                - 'apps/storybook/**'
                - 'packages/js/keycloak-theme/**'
                - 'packages/js/ui/**'
                - 'packages/js/eslint-config-p4b/**'
                - 'packages/js/prettier-config/**'
                - 'packages/js/tsconfig/**'
                - 'packages/js/types/**'
                - '.prettier*'
                - 'pnpm-lock.yaml'

            processes:
                - 'apps/processes/**'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            # What the tools and print worker images are built from.
            workers:
                - 'apps/processes/workers/**'
                - 'packages/python/goatlib/**'
                - 'packages/cpp/routing/**'
                - 'pyproject.toml'
                - 'uv.lock'

            # The server and default worker images are the upstream Windmill
            # image with one setting each, defined only in this Dockerfile.
            windmill:
                - 'apps/processes/workers/Dockerfile'
