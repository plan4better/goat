name: "Checks"

on:
  workflow_call:
    outputs:
      web:
        description: "Web changed"
        value: ${{ jobs.checks.outputs.web }}

      core:
        description: "Core changed"
        value: ${{ jobs.checks.outputs.core }}

      geoapi:
        description: "Geoapi changed"
        value: ${{ jobs.checks.outputs.geoapi }}

      docs:
        description: "Docs changed"
        value: ${{ jobs.checks.outputs.docs }}

      keycloak-theme:
        description: "Keycloak theme changed"
        value: ${{ jobs.checks.outputs.keycloak-theme }}

      storybook:
        description: "Storybook changed"
        value: ${{ jobs.checks.outputs.storybook }}

      processes:
        description: "Processes API changed"
        value: ${{ jobs.checks.outputs.processes }}

      workers:
        description: "Windmill worker images (tools, print) changed"
        value: ${{ jobs.checks.outputs.workers }}

      windmill:
        description: "Windmill server and default worker images changed"
        value: ${{ jobs.checks.outputs.windmill }}

      catalog:
        description: "Catalog (STAC service) changed"
        value: ${{ jobs.checks.outputs.catalog }}

      assistant:
        description: "Assistant (AI service) changed"
        value: ${{ jobs.checks.outputs.assistant }}

      compose-bundle:
        description: "Single-server deployment bundle (deploy/compose) changed"
        value: ${{ jobs.checks.outputs.compose-bundle }}

      helm:
        description: "Helm chart (deploy/helm) changed"
        value: ${{ jobs.checks.outputs.helm }}

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
      contents: read
    # A manual run (workflow_dispatch) counts every area as changed, so
    # running a workflow by hand rebuilds and retests everything.
    outputs:
      web: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.web }}
      core: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.core }}
      geoapi: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.geoapi }}
      docs: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.docs }}
      keycloak-theme: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.keycloak-theme }}
      storybook: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.storybook }}
      processes: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.processes }}
      workers: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.workers }}
      windmill: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.windmill }}
      catalog: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.catalog }}
      assistant: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.assistant }}
      compose-bundle: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.compose-bundle }}
      helm: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.changes.outputs.helm }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🕵️ Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            # The editor draws the configs the assistant builds, read from the
            # assistant's shared fixture (lib/validations/__tests__/workflowDrafts.test.ts).
            web:
                - 'apps/web/**'
                - 'apps/assistant/tests/fixtures/workflow_drafts.json'
                - 'packages/js/**'
                - '.prettier*'
                - 'pnpm-lock.yaml'

            core:
                - 'apps/core/**'
                # The alembic job proves the assistant's grant list against
                # core's real schema and authz functions.
                - 'apps/assistant/sql/**'
                - 'apps/assistant/src/assistant/dbcheck.py'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            geoapi:
                - 'apps/geoapi/**'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            catalog:
                - 'apps/catalog/**'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            # The assistant's tests build its tables from core's models and run
            # the catalog pack against the catalog app.
            # test_image_contract.py reads the compose file and the Helm values;
            # test_encoding compares against the web's golden stream fixtures.
            assistant:
                - 'apps/assistant/**'
                - 'apps/web/lib/assistant/__tests__/fixtures/**'
                - 'apps/core/**'
                - 'apps/catalog/**'
                - 'deploy/compose/compose.yaml'
                - 'deploy/helm/goat/values.yaml'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            docs:
                - 'apps/docs/**'
                - 'packages/js/**'
                - '.prettier*'
                - 'pnpm-lock.yaml'

            keycloak-theme:
                - 'packages/js/keycloak-theme/**'
                - 'packages/js/eslint-config-p4b/**'
                - 'packages/js/prettier-config/**'
                - 'packages/js/tsconfig/**'
                - 'packages/js/types/**'
                - 'packages/js/ui/**'
                - '.prettier*'
                - 'pnpm-lock.yaml'

            storybook:
                - 'apps/storybook/**'
                - 'packages/js/keycloak-theme/**'
                - 'packages/js/ui/**'
                - 'packages/js/eslint-config-p4b/**'
                - 'packages/js/prettier-config/**'
                - 'packages/js/tsconfig/**'
                - 'packages/js/types/**'
                - '.prettier*'
                - 'pnpm-lock.yaml'

            processes:
                - 'apps/processes/**'
                - 'packages/python/goatlib/**'
                - 'packages/python/goatobs/**'
                - 'pyproject.toml'
                - 'uv.lock'

            compose-bundle:
                - 'deploy/compose/**'

            helm:
                - 'deploy/helm/**'
                - '.github/actions/helm-tools/**'

            # What the tools and print worker images are built from.
            workers:
                - 'apps/processes/workers/**'
                - 'packages/python/goatlib/**'
                - 'packages/cpp/routing/**'
                - 'pyproject.toml'
                - 'uv.lock'

            # The server and default worker images are the upstream Windmill
            # image with one setting each, defined only in this Dockerfile.
            windmill:
                - 'apps/processes/workers/Dockerfile'
