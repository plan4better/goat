########################################################################################
# "client-cache-build" composite action for client build                               #
#--------------------------------------------------------------------------------------#
#                                                                                      #
# Usage in workflows steps:                                                            #
#                                                                                      #
#      - name: 🏗️ Monorepo build                                                       #
#        uses: ./.github/actions/client-cache-build                                    #
#        with:                                                                         #
#          cwd: ${{ github.workspace }}/apps/web  # (default = '.')                    #
########################################################################################

name: "Cache production build binaries"
description: "Cache or restore if necessary"
author: "Plan4Better GmbH"

inputs:
  cwd:
    description: "Changes node's process.cwd() if the project is not located on the root. Default to process.cwd()"
    required: false
    default: "."
  node_version:
    description: "Node version to use"
    required: false
    default: v22.x

runs:
  using: "composite"
  steps:
    # Keyed on the commit, so it only hands one run's build to a later job of
    # the same run (bundle analysis restores what the build job made) and
    # never serves a build across commits. Only the build output is cached:
    # Next's .next/cache and turbo's archives are large, nothing here reads
    # them, and they filled the repository's cache quota, evicting the caches
    # other jobs restore.
    - name: Cache production build
      uses: actions/cache@v6
      id: cache-build
      env:
        cache-name: prod-build
        key-3: ${{ github.event.pull_request.number || github.ref }}
        key-4: ${{ github.sha }}
      with:
        path: |
          ${{ github.workspace }}/apps/web/.next
          !${{ github.workspace }}/apps/web/.next/cache
        key: ${{ runner.os }}-${{ env.cache-name }}-${{ inputs.node_version }}-${{ env.key-3 }}-${{ env.key-4 }}

    - run: pnpm run build
      working-directory: ${{ inputs.cwd }}
      if: steps.cache-build.outputs.cache-hit != 'true'
      shell: bash
