parent=base
locales=de,en
# Row styles, the same as core's emails (pages wrap them in <tr><td>).
actionButtonStyle=display:inline-block;background-color:#2bb381;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;padding:12px 28px;border-radius:24px;margin:8px 40px;
infoContentStyle=font-size:15px;line-height:1.6;color:#26303b;padding:4px 40px 12px 40px;
titleStyle=color:#26303b;padding:16px 40px 4px 40px;

# Branding, read from the Keycloak container's environment when the theme
# loads (${env.NAME:default}). The same settings core uses for its emails:
# without a logo the brand name is shown as text; footer links without a URL
# are left out.
brandName=${env.EMAIL_BRAND_NAME:GOAT}
logoUrl=${env.EMAIL_LOGO_URL:}
contactUrl=${env.EMAIL_CONTACT_URL:}
privacyUrl=${env.EMAIL_PRIVACY_URL:}
# Who runs this GOAT, as a footer line (name, address), linked to the URL.
companyName=${env.EMAIL_COMPANY_NAME:}
companyUrl=${env.EMAIL_COMPANY_URL:}
# GOAT's public web URL: the header links to it and the email artwork is
# served under it at /assets, unless STATIC_ASSETS_URL names another base.
# Without either, the emails carry no artwork.
appUrl=${env.GOAT_PUBLIC_URL:}
staticAssetsUrl=${env.STATIC_ASSETS_URL:}
