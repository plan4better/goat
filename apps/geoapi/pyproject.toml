[project]
name = "geoapi"
version = "2.0.0"
description = "GOAT GeoAPI - OGC Features and Tiles API powered by DuckDB/DuckLake"
authors = [{ name = "Plan4Better GmbH", email = "dev@plan4better.de" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "duckdb>=1.5.4",
    "asyncpg>=0.29.0",
    "pygeofilter>=0.2.0",
    "sqlglot>=26.0.0",
    "goatlib[raster]",
    "goatobs",
    "cachetools",
    "python-jose[cryptography]>=3.3.0",
    "requests>=2.25.0",
    "pmtiles>=3.5.0",
    "redis>=5.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geoapi"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "network: Tests that access external network services (WFS, HTTP, etc.)",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
