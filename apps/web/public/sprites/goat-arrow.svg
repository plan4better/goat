<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- GOAT Style's arrow (goat:arrow): an isosceles triangle pointing north, filling the canvas, so a rotation by
       the line's bearing points it along the line. Tinted via icon-color when registered as SDF. -->
  <polygon points="0,32 16,0 32,32" fill="#000000"/>
</svg>
